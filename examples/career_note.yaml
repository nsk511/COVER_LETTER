# ============================================================
#  경력 노트 (career note) — 샘플
#  ※ 아래 내용은 구조를 보여주기 위한 가상의 예시입니다.
#    반드시 본인의 '실제' 경험으로 전부 교체하세요.
#    여기에 없는 내용은 자소서에 쓰지 않는 것이 이 도구의 원칙입니다.
# ============================================================

owner:
  name: 홍길동
  headline: 보험계리 컨설턴트
  years: 3
  email: example@example.com

# 본인이 일할 때 지키는 기준. 지원동기 문항에서 회사 방향성과 연결할 재료.
values:
  - 숫자가 틀렸을 가능성을 먼저 의심하고 원인을 끝까지 추적한다
  - 결과보다 재현 가능한 절차를 남긴다

strengths:
  - label: 원인 추적력
    detail: 결과 수치가 이상하면 산출 로직과 데이터 정의까지 거슬러 올라가 원인을 찾는다
    evidence: [exp-rate-agg, exp-reserve-check]

weaknesses:
  # 약점은 '실제로 본인이 말한 것'만 적습니다. 지어내지 마세요.
  - label: 설명 자료 정리에 시간이 더 걸림
    detail: 문제 해결에 집중하다 보니 중간 산출물을 남에게 설명할 형태로 정리하는 데 시간이 더 필요했다
    improving: 작업 착수 시 결과 보고 목차를 먼저 잡고 시작하는 방식으로 바꿔 적용 중
    offset_by: 원인 추적력   # 같은 강점으로 보완하는 구조로 씁니다

skills:
  - name: SQL
    level: 상
    detail: 대용량 계약/사고 데이터 집계, 산출 로직 구현, 정합성 검증 쿼리 작성
  - name: Excel
    level: 중상
    detail: 피벗/함수 기반 검증표, 결과 비교 자동화
  - name: 보험계리
    level: 중
    detail: 요율산출 보조, 준비금 검증 업무 수행

experiences:
  - id: exp-rate-agg
    title: 요율산출 집계 단위 재설계로 산출 시간 단축
    period: 2024-03 ~ 2024-06
    org: A컨설팅 (고객사명은 대외비로 일반화)
    role: 산출 로직 담당 컨설턴트
    domain: [자동차보험, 요율산출]
    situation: 매월 요율 재산출에 배치 시간이 길어 검증할 시간이 부족했다
    task: 산출 결과를 바꾸지 않으면서 재산출 소요 시간을 줄여야 했다
    action: >-
      계약 단위로 반복 계산하던 구조를 확인한 뒤, 담보·지역 조건이 같은 계약은
      동일한 위험률을 적용받는다는 점을 근거로 집계 단위를 계약 단위에서
      조건 단위로 재설계했다. 재설계 전후 결과가 일치하는지 전 건 대조 쿼리로 검증했다.
    result: 재산출 소요 시간이 크게 줄어 검증에 쓸 시간을 확보했고, 결과 차이는 0건이었다
    insight: >-
      성능 문제가 아니라 '업무상 같은 값이 나오는 계약을 왜 따로 계산하는가'라는
      업무 구조의 문제였다는 점이 핵심이다. (일반적인 쿼리 튜닝이 아니다)
    difficulty: 결과가 1원도 달라지면 안 되는 산출이라, 성능보다 동일성 검증이 더 어려웠다
    collaboration: 현업 담당자와 담보 조건 정의를 재확인하고 검증 기준을 합의했다
    lesson: 속도 개선은 코드가 아니라 업무 정의에서 나올 때가 있다
    metrics:
      - name: 재산출 소요 시간
        before: 90분
        after: 20분
        delta: 약 78% 단축
      - name: 산출 결과 차이
        after: 0건
    axes: [데이터·분석, 창의·문제해결]
    keywords: [SQL, 집계, 요율, 검증]
    confidential: true
    verified: true

  - id: exp-reserve-check
    title: 준비금 검증 절차 표준화
    period: 2023-07 ~ 2023-12
    org: A컨설팅
    role: 검증 담당
    domain: [장기보험, 준비금]
    situation: 검증이 담당자마다 다른 방식으로 이뤄져 재현이 어려웠다
    task: 누가 해도 같은 결과가 나오는 검증 절차가 필요했다
    action: 검증 항목을 목록화하고 SQL 기반 점검 쿼리로 표준화한 뒤 결과를 한 장으로 요약했다
    result: 검증 항목 누락이 사라지고, 인수인계 시 동일 절차로 재현 가능해졌다
    insight: 검증은 '많이 보는 것'이 아니라 '빠짐없이 같은 것을 보는 것'이다
    difficulty: 기존 방식에 익숙한 담당자를 설득해야 했다
    collaboration: 팀 내 3명과 점검 항목을 합의하고 교육 자료를 만들어 공유했다
    lesson: 절차를 문서로 남기면 설득이 쉬워진다
    metrics:
      - name: 표준 점검 항목
        after: 12개
    axes: [정직·신뢰, 협업·소통]
    keywords: [준비금, 검증, 표준화, SQL]
    confidential: false
    verified: true
