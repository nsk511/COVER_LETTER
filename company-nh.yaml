# ============================================================
#  농협손해보험 자기소개서 문항 (업로드하신 화면 그대로 옮김)
#  ※ 직무는 '상품·계리'로 가정했습니다 — 다르면 position 만 고치세요.
#  ※ 인재상은 확인되지 않아 비워 두었습니다. 채용 홈페이지 문구를 그대로 넣으면
#    매칭 정확도가 올라갑니다.
# ============================================================

company:
  name: 농협손해보험
  position: 상품·계리
  team: ""
  talent_profile: []          # ← 채용 홈페이지의 인재상 문구를 한 줄씩
  core_competencies: []       # ← 직무기술서(JD)의 핵심 업무를 쉼표로
  keywords: []
  research: []                # 지원동기 문항이 없어 리서치 부담은 낮습니다

questions:
  - id: q1
    text: 도전적인 목표를 설정하고 이를 달성하기 위해 꾸준히 실행 또는 노력했던 경험을 구체적으로 작성해 주십시오 (목표의 수준, 목표달성 과정, 실행 또는 노력의 결과 등 작성)
    type: challenge
    limit: {max: 800, count_mode: with_space}

  - id: q2
    text: 업무를 수행하는 과정에서 상대방의 불만이나 반대의견 또는 소통오류로 어려움을 겪었던 경험을 작성하고 문제를 해결하는 과정에서 배운 자신만의 소통원칙을 작성해 주십시오 (상황에 대한 원인파악, 해결과정 및 방법, 본인만의 소통원칙 등 작성)
    type: collaboration
    limit: {max: 800, count_mode: with_space}

  - id: q3
    text: 본인이 생각하는 '책임감'이 무엇인지 정의하고, 본인의 역할이나 책임이 명확하지 않은 상황에서도 스스로 책임감을 가지고 주도적으로 행동했던 경험을 작성해 주십시오 (책임감의 정의, 주도적으로 행동했던 판단 근거, 결과로부터 배운점 등 작성)
    type: value_definition
    limit: {max: 800, count_mode: with_space}

  - id: q4
    text: 최근 세대간 가치관 및 업무방식의 차이로 조직 내 갈등이 빈번히 발생하고 있습니다. 이러한 갈등이 발생하는 원인에 대한 본인의 생각을 기술하고, 실제 세대차이로 인한 이견이나 갈등상황에서 이를 해결하기 위해 취했던 구체적인 행동과 그 결과를 작성해 주십시오
    type: opinion_experience
    limit: {max: 800, count_mode: with_space}

  - id: q5
    text: 새로운 조직에 적응하는데 있어 본인이 생각하는 가장 중요한 역량이 무엇인지 아래 보기에서 한가지를 선택하여 설명하고 이와 관련한 본인의 경험을 작성해 주십시오 [문제해결력, 책임감, 조직적응력, 주도성, 자기개발, 정확성, 비판적 사고, 그외 본인이 생각하는 역량]
    type: value_definition
    limit: {max: 800, count_mode: with_space}
