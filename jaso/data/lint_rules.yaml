# 자소서 검증 규칙 데이터

# 1) 뭉뚱그린 클리셰 — 구체적 도메인 설명으로 바꿔야 하는 표현
cliches:
  - phrase: 불필요한 로직
    why: 무엇이 왜 불필요했는지(도메인 이유)를 써야 꼬리질문을 방어할 수 있다
  - phrase: 불필요한 반복 연산
    why: 반복이 필요 없던 '업무상의 이유'를 구체적으로 쓴다
  - phrase: 중복 조인 제거
    why: 일반적 SQL 튜닝 클리셰. 실제로 무엇을 어떤 단위로 바꿨는지 쓴다
  - phrase: 코드 최적화
    why: 무엇을 어떻게 바꿨는지가 없다
  - phrase: 쿼리 최적화
    why: 최적화의 근거가 된 데이터 특성을 밝힌다
  - phrase: 효율적으로 개선
    why: 효율의 기준(시간/건수/비용)을 숫자로 쓴다
  - phrase: 최선을 다해
    why: 행동이 없다
  - phrase: 열정을 가지고
    why: 태도 선언은 근거가 되지 않는다
  - phrase: 열정적으로
    why: 태도 선언은 근거가 되지 않는다
  - phrase: 성실하게
    why: 무엇을 성실히 했는지 행동으로 쓴다
  - phrase: 소통의 중요성을 배웠
    why: 흔한 마무리. 배운 것을 다음 행동으로 연결한다
  - phrase: 귀사의 일원이 되어
    why: 상투적 표현. 회사명을 쓰고 구체적 기여를 쓴다
  - phrase: 뼈를 묻
    why: 과장된 충성 표현
  - phrase: 어떤 일이든 맡겨주시면
    why: 직무 특정성이 없다
  - phrase: 남들보다 빠르게
    why: 비교 근거가 없다
  - phrase: 많은 것을 배웠습니다
    why: 무엇을 배워 무엇이 달라졌는지 쓴다

# 2) 근무 외 시간을 강조하는 서술 — 결과 중심으로 바꾼다
overtime_markers:
  - 야근
  - 퇴근 후
  - 퇴근후
  - 주말에도
  - 새벽까지
  - 밤을 새
  - 밤새워
  - 휴일에도

# 3) 치명적 약점 신호 — 약점 문항에서 이런 단정형 표현은 위험하다
fatal_weakness_patterns:
  - 서툽니다
  - 서툴렀습니다
  - 못합니다
  - 부족합니다
  - 자신이 없습니다
  - 어려워합니다
  - 싫어합니다
  - 피하는 편입니다

# 약점 톤을 낮출 때 쓰는 대체 표현 (제안용)
weakness_softeners:
  - "~에 집중하다 보니 ~하는 데 더 많은 노력이 필요했습니다"
  - "~을 우선하다 보니 ~은 의식적으로 연습하고 있습니다"

# 4) 회사 관련 사실 주장을 담은 문장 신호 — research 출처와 대조한다
company_fact_markers:
  - 년
  - 회차
  - 업계 최초
  - 1위
  - 최대
  - 캠페인
  - 출시
  - 수상
  - 선정
  - 발표
  - 인수
  - 설립
  - 매출

# 5) 지원동기 문항에서 '회사 이야기' 문장을 식별하는 신호
company_story_markers:
  - 창업
  - 창립
  - 설립
  - 연혁
  - 사훈
  - 비전
  - 미션
  - 경영철학
  - 회장
  - 대표이사
  - CEO
  - 사회공헌
  - CSR
  - 캠페인

# 6) 문장 길이 기준 (공백포함)
sentence:
  max_chars: 95
  warn_ratio: 0.25   # 기준 초과 문장이 이 비율을 넘으면 경고

# 7) 흔한 띄어쓰기 오류 — [잘못된 표기, 올바른 표기, 이유]
spacing:
  - ["하고있", "하고 있", "'있다'는 보조용언이라 띄어 씁니다"]
  - ["되어있", "되어 있", "'있다'는 보조용언이라 띄어 씁니다"]
  - ["하고있습니다", "하고 있습니다", "보조용언은 띄어 씁니다"]
  - ["할수있", "할 수 있", "'수'는 의존명사라 띄어 씁니다"]
  - ["수있습니다", "수 있습니다", "'수'는 의존명사라 띄어 씁니다"]
  - ["하는것", "하는 것", "'것'은 의존명사라 띄어 씁니다"]
  - ["있는것", "있는 것", "'것'은 의존명사라 띄어 씁니다"]
  - ["것같습니다", "것 같습니다", "'같다'는 띄어 씁니다"]
  - ["한만큼", "한 만큼", "관형형 뒤의 '만큼'은 의존명사라 띄어 씁니다"]
  - ["목표 만큼", "목표만큼", "명사 뒤의 '만큼'은 조사라 붙여 씁니다"]
  - ["달가워 하지", "달가워하지", "'-워하다'는 한 단어입니다"]
  - ["수행 해내", "수행해내", "'-해내다'는 붙여 씁니다"]
  - ["좋은성적", "좋은 성적", "관형어와 명사는 띄어 씁니다"]
  - ["큰영향", "큰 영향", "관형어와 명사는 띄어 씁니다"]
  - ["등과같이", "등과 같이", "'같이'는 띄어 씁니다"]
  - ["이라고생각", "이라고 생각", "용언은 띄어 씁니다"]
  - ["노력하고있", "노력하고 있", "보조용언은 띄어 씁니다"]
