# 인재상 역량축 사전
#   aliases : 회사 인재상 문구를 이 축으로 매핑할 때 쓰는 표현
#   signals : 경험 텍스트에서 이 축의 '증거'로 볼 수 있는 단어
#   probes  : 이 축에 대한 면접 기본 질문
axes:
  도전·혁신:
    aliases: [도전, 챌린지, 혁신, 개척, 변화, 선도, 진취, 프론티어, 창조, 도전정신]
    signals: [처음, 최초, 신규, 새로운, 시도, 제안, 개선, 바꾸, 도입, 전환, 재설계, 자동화]
    probes:
      - 기존 방식을 바꾸자고 먼저 제안한 경험이 있나요? 반대는 없었나요?
      - 실패할 수도 있었던 시도 중 가장 위험했던 것은 무엇이었나요?

  전문성:
    aliases: [전문성, 프로페셔널, 전문가, 실력, 역량, 프로, 최고]
    signals: [자격, 분석, 설계, 검증, 산출, 모델, 논문, 스터디, 시험, 합격, 심화, 원리]
    probes:
      - 본인이 가진 전문성을 한 문장으로 정의한다면 무엇인가요?
      - 그 분야에서 최근에 새로 배운 것은 무엇인가요?

  고객중심:
    aliases: [고객, 고객중심, 고객가치, 소비자, 고객만족, 고객제일]
    signals: [고객, 현업, 사용자, 담당자, 요청, 니즈, 불만, 민원, 상담, 현장]
    probes:
      - 고객(또는 현업)의 요구와 원칙이 충돌했을 때 어떻게 했나요?
      - 고객 입장에서 생각해 결과를 바꾼 경험이 있나요?

  협업·소통:
    aliases: [협업, 소통, 팀워크, 함께, 시너지, 화합, 동료, 커뮤니케이션, 원팀]
    signals: [협업, 협의, 회의, 설득, 조율, 공유, 함께, 팀, 부서, 유관, 인수인계, 교육]
    probes:
      - 의견이 끝까지 좁혀지지 않았던 상대를 어떻게 설득했나요?
      - 협업에서 본인이 맡은 역할은 정확히 무엇이었나요?

  정직·신뢰:
    aliases: [정직, 신뢰, 윤리, 진정성, 책임, 준법, 원칙, 투명]
    signals: [검증, 이중, 교차, 확인, 원칙, 규정, 감사, 리스크, 오류, 정합성, 재현]
    probes:
      - 실수를 먼저 밝혀야 했던 상황이 있었나요? 어떻게 했나요?
      - 숫자가 틀렸다는 걸 뒤늦게 알았을 때 어떤 절차를 밟나요?

  데이터·분석:
    aliases: [데이터, 분석, 디지털, DT, AI, 통계, 데이터기반, 인사이트]
    signals: [SQL, 쿼리, 데이터, 통계, 산출, 집계, 모형, 모델링, 검증, 추정, 엑셀, 파이썬, R, 지표]
    probes:
      - 분석 결과가 직관과 달랐을 때 어떻게 판단했나요?
      - 데이터 품질 문제를 발견한 경험이 있나요?

  실행력·책임감:
    aliases: [실행, 실행력, 책임, 주인의식, 끈기, 완수, 성실, 오너십, 성과, 성과중심, 성과주의]
    signals: [마감, 기한, 일정, 완료, 끝까지, 야근, 단독, 담당, 주도, 마무리, 재작업]
    probes:
      - 아무도 시키지 않았는데 끝까지 마무리한 일이 있나요?
      - 일정이 불가능해 보였을 때 무엇을 포기하고 무엇을 지켰나요?

  성장·학습:
    aliases: [성장, 학습, 배움, 자기계발, 발전, 인재육성]
    signals: [학습, 공부, 자격증, 시험, 스터디, 독학, 교육, 습득, 익힌, 강의]
    probes:
      - 최근 1년간 스스로 학습해서 업무에 적용한 것은 무엇인가요?

  글로벌:
    aliases: [글로벌, 국제, 해외, 세계]
    signals: [해외, 영어, 글로벌, 현지, 수출, 국제, IFRS, 재보험]
    probes:
      - 해외/글로벌 기준을 업무에 적용해 본 경험이 있나요?

  창의·문제해결:
    aliases: [창의, 창의성, 아이디어, 문제해결, 유연, 발상]
    signals: [원인, 근본, 해결, 발견, 가설, 대안, 우회, 아이디어, 단순화, 구조]
    probes:
      - 남들이 못 찾은 원인을 찾아낸 경험이 있나요?
      - 그 해결책이 최선이라고 판단한 근거는 무엇이었나요?

  리더십:
    aliases: [리더십, 리더, 주도, 이끄는, 육성]
    signals: [리드, 주도, 총괄, PM, 팀장, 후배, 멘토, 교육, 배분, 의사결정]
    probes:
      - 팀을 이끌며 가장 어려웠던 의사결정은 무엇이었나요?
