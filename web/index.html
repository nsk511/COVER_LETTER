/* ── 검증 ── */
function findingHTML(f) {
  return '<div class="finding ' + f.level + '"><span class="code">' + esc(f.rule) + "</span>" +
    '<span class="msg">' + esc(f.message) + "</span>" +
    (f.ev ? '<span class="ev">' + esc(f.ev) + "</span>" : "<span></span>") +
    (f.fix ? '<span class="fix">→ ' + esc(f.fix) + "</span>" : "<span></span>") + "</div>";
}

function renderLint() {
  const { career, company, draft } = state;
  const all = lintAll(career, company, draft);
  const errors = all.filter((f) => f.level === "ERROR");
  const warns = all.filter((f) => f.level === "WARN");
  const order = { ERROR: 0, WARN: 1, INFO: 2 };

  const blocks = (company.questions || []).map((q) => {
    const mine = all.filter((f) => f.qid === q.id).sort((a, b) => order[a.level] - order[b.level]);
    if (!mine.length) return "";
    return '<div class="card"><h3 style="font-size:14px">' + esc(q.id) + " · " + esc(truncate(q.text, 46)) + "</h3>" +
      '<div style="margin-top:10px">' + mine.map(findingHTML).join("") + "</div></div>";
  }).join("");

  $("#panel-lint").innerHTML =
    '<div class="panel-head"><h2 id="h-lint">검증</h2>' +
    "<p>오류(빨강)는 제출 전에 반드시 고칩니다. 특히 <b>NUM</b>(경력 노트에 없는 수치)과 <b>FACT</b>(출처 없는 회사 주장)는 " +
    "면접에서 그대로 무너지는 항목입니다.</p></div>" +
    '<div class="stack">' +
    '<div class="card score"><span><b class="e">' + errors.length + "</b> 오류</span>" +
    '<span><b class="w">' + warns.length + "</b> 경고</span>" +
    '<span class="note" style="margin-left:auto">' + (errors.length ? "제출 전 수정이 필요합니다" : "오류 없음 — 경고는 참고용입니다") + "</span></div>" +
    (blocks || '<p class="empty">검증할 답변이 없습니다</p>') +
    '<div class="row"><button class="btn primary" data-act="export-md">자기소개서 파일로 저장 (.md)</button></div></div>';
}

/* ── 면접 준비 ── */
function renderInterview() {
  const pack = buildInterview(state.career, state.company, state.draft);
  const grouped = {};
  pack.items.forEach((i) => (grouped[i.category] = grouped[i.category] || []).push(i));
  const high = pack.items.filter((i) => i.risk === "높음").length;

  const groups = Object.entries(grouped).map(([cat, items]) =>
    '<div class="card"><h3 style="font-size:14px">' + esc(cat) + "</h3>" +
    items.map((i) => '<div class="q-item"><div class="row" style="gap:8px"><span class="risk ' + i.risk + '">' + i.risk +
      '</span><span class="q">' + esc(i.question) + "</span></div>" +
      (i.source ? '<div class="meta">근거: ' + esc(i.source) + "</div>" : "") +
      (i.prep ? '<div class="meta">답변 뼈대: ' + esc(i.prep) + "</div>" : "") + "</div>").join("") + "</div>").join("");

  $("#panel-interview").innerHTML =
    '<div class="panel-head"><h2 id="h-interview">면접 준비</h2>' +
    "<p>면접관은 자소서에 쓴 문장을 근거로 묻습니다. 그래서 질문은 지어내는 것이 아니라 초안에서 역산하는 것입니다. " +
    "수치·도메인 용어·협업·약점 서술은 각각 정해진 형태의 꼬리질문을 부릅니다.</p></div>" +
    '<div class="stack">' +
    '<div class="card score"><span><b>' + pack.items.length + "</b> 예상질문</span>" +
    '<span><b class="e">' + high + "</b> 우선 준비</span>" +
    '<span style="margin-left:auto"><button class="btn" data-act="export-csv">준비표 내려받기 (.csv)</button></span></div>' +
    groups +
    (pack.scripts.length ? '<h3>경험별 구술 스크립트</h3>' +
      pack.scripts.map(([, s]) => '<pre class="script">' + esc(s) + "</pre>").join("") : "") +
    (pack.gaps.length ? '<div class="card"><h3 style="font-size:14px">보강이 필요한 부분</h3>' +
      pack.gaps.map((g) => '<p class="note" style="color:var(--warn)">· ' + esc(g) + "</p>").join("") + "</div>" : "") +
    "</div>";
}

/* ── 전체 ── */
function render() {
  renderNav();
  renderBanner();
  document.querySelectorAll(".panel").forEach((p) => p.classList.remove("on"));
  $("#panel-" + state.view).classList.add("on");
  ({ career: renderCareer, company: renderCompany, match: renderMatch,
     write: renderWrite, lint: renderLint, interview: renderInterview })[state.view]();
  const chip = $("#company-chip");
  const options = Object.entries(state.spaces).map(([id, sp]) =>
    '<option value="' + esc(id) + '"' + (id === state.activeId ? " selected" : "") + ">" +
    esc(spaceLabel(sp)) + (sp.company.position ? " · " + esc(sp.company.position) : "") + "</option>").join("");
  chip.innerHTML = '<span class="dot ' + (state.company.name ? "saved" : "") + '"></span>' +
    '<select id="company-picker" data-act="switch-company" aria-label="회사 선택"' +
    ' style="border:0;background:transparent;padding:0;width:auto;font-weight:600">' + options + "</select>" +
    '<button class="btn quiet" data-act="add-company" title="회사 추가" style="padding:0 4px">+</button>';
}

/* ══════════════════════════════════════════════════════════
   11. 내보내기
   ══════════════════════════════════════════════════════════ */

function finalMarkdown() {
  const { company, draft } = state;
  const out = ["# " + (company.name || "") + " 자기소개서", "",
    "- 지원 직무: " + (company.position || "") + (company.team ? " (" + company.team + ")" : ""),
    "- 작성일: " + new Date().toISOString().slice(0, 10), "", "---", ""];
  for (const q of company.questions || []) {
    const a = draft[q.id];
    out.push("## " + q.text);
    if (!a || !(a.body || "").trim()) { out.push("", "> 미작성", "", "---", ""); continue; }
    const c = countChars((a.subtitle ? "[" + a.subtitle + "]\n" : "") + a.body);
    out.push("", "**[" + (a.subtitle || "소제목 없음") + "]**", "",
      "> " + limitLabel(q) + " · 실제 공백포함 " + c.withSpace + "자 / 공백제외 " + c.withoutSpace + "자", "",
      a.body, "");
    if (a.note) out.push("확인 필요: " + a.note, "");
    out.push("---", "");
  }
  const todo = lintAll(state.career, company, draft).filter((f) => f.level !== "INFO");
  if (todo.length) {
    out.push("### 제출 전 확인 사항", "");
    todo.forEach((f) => out.push("- [" + f.level + "] (" + f.qid + ") " + f.message));
  }
  return out.join("\n");
}

function interviewCSV() {
  const pack = buildInterview(state.career, state.company, state.draft);
  const rows = [["우선순위", "분류", "예상질문", "자소서 근거", "답변 뼈대", "준비완료(O/X)", "내 답변 메모"]];
  pack.items.forEach((i) => rows.push([i.risk, i.category, i.question, i.source, i.prep, "", ""]));
  const body = rows.map((r) => r.map((cell) => '"' + String(cell == null ? "" : cell).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  return "﻿" + body;
}

async function offerDownload(filename, data) {
  const downloads = await claude.use("downloads");
  if (!downloads) { toast("이 화면에서는 파일 저장을 쓸 수 없습니다. 내용을 복사해 사용하세요."); return; }
  try {
    await downloads.save({ filename, data });
    toast(filename + " 저장을 요청했습니다.");
  } catch (err) {
    const code = err && err.code;
    if (code === "declined") return;
    toast(code === "rate_limited" ? "잠시 후 다시 시도하세요." : "파일을 저장하지 못했습니다.");
  }
}

let toastTimer = null;
function toast(message) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;" +
      "background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:100px;font-size:13px;box-shadow:var(--shadow)";
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}
</script>

<script>
/* ══════════════════════════════════════════════════════════
   12. 동작
   ══════════════════════════════════════════════════════════ */

async function useCap(name) {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return null;
    return await window.claude.use(name);
  } catch (e) { return null; }
}

function readValue(el) {
  const type = el.dataset.type || "text";
  if (type === "bool") return el.checked;
  if (type === "number") return el.value === "" ? null : Number(el.value);
  if (type === "lines") return el.value.split("\n").map((s) => s.trim()).filter(Boolean);
  if (type === "csv") return el.value.split(",").map((s) => s.trim()).filter(Boolean);
  return el.value;
}

function onFieldChange(event) {
  const el = event.target;
  if (el.dataset.bind) {
    setPath(el.dataset.bind, readValue(el));
    markDirty();
    if (/company\.(name|position)/.test(el.dataset.bind)) render();
    return;
  }
  if (el.dataset.answer) {
    const answer = state.draft[state.activeQ] || (state.draft[state.activeQ] = { subtitle: "", body: "", used: [] });
    answer[el.dataset.answer] = el.value;
    markDirty();
    const q = (state.company.questions || []).find((x) => x.id === state.activeQ);
    const slot = document.getElementById("counter-slot");
    if (q && slot) slot.innerHTML = counterHTML(q, answer);
    return;
  }
  if (el.dataset.act === "switch-company") { ACTIONS["switch-company"](el); return; }
  if (el.dataset.act === "toggle-use") {
    const q = state.company.questions[Number(el.dataset.i)];
    q.use = q.use || [];
    const id = el.dataset.exp;
    q.use = el.checked ? [...new Set(q.use.concat([id]))] : q.use.filter((x) => x !== id);
    markDirty();
    return;
  }
  if (el.dataset.act === "toggle-answer-use") {
    const answer = state.draft[state.activeQ];
    answer.used = answer.used || [];
    const id = el.dataset.exp;
    answer.used = el.checked ? [...new Set(answer.used.concat([id]))] : answer.used.filter((x) => x !== id);
    markDirty();
    render();
  }
}

document.addEventListener("input", onFieldChange);
document.addEventListener("change", onFieldChange);

document.addEventListener("toggle", (event) => {
  const el = event.target;
  if (el.tagName === "DETAILS" && el.dataset.exp) state.openExp = el.open ? el.dataset.exp : null;
}, true);

const ACTIONS = {
  view(el) { state.view = el.dataset.view; render(); window.scrollTo({ top: 0 }); },
  "pick-q"(el) { state.activeQ = el.dataset.q; render(); },

  "add-exp"() {
    const id = uid("exp");
    state.career.experiences.push({ id, title: "", period: "", org: "", role: "", domain: [], keywords: [],
      situation: "", task: "", action: "", result: "", insight: "", difficulty: "", collaboration: "", lesson: "",
      metrics: [], axes: [], confidential: false, verified: true });
    state.openExp = id;
    markDirty(); render();
  },
  "del-exp"(el) {
    if (!confirm("이 경험을 삭제할까요?")) return;
    state.career.experiences.splice(Number(el.dataset.i), 1);
    markDirty(); render();
  },
  "add-metric"(el) {
    const exp = state.career.experiences[Number(el.dataset.i)];
    (exp.metrics = exp.metrics || []).push({ name: "", before: "", after: "", delta: "" });
    state.openExp = exp.id;
    markDirty(); render();
  },
  "del-metric"(el) {
    const exp = state.career.experiences[Number(el.dataset.i)];
    exp.metrics.splice(Number(el.dataset.j), 1);
    state.openExp = exp.id;
    markDirty(); render();
  },
  "add-trait"(el) {
    const kind = el.dataset.kind;
    (state.career[kind] = state.career[kind] || []).push({ label: "", detail: "", evidence: [], improving: "", offset_by: "" });
    markDirty(); render();
  },
  "del-trait"(el) { state.career[el.dataset.kind].splice(Number(el.dataset.i), 1); markDirty(); render(); },

  "add-research"() {
    (state.company.research = state.company.research || []).push({ claim: "", source: "", date: "", checked: false });
    markDirty(); render();
  },
  "del-research"(el) { state.company.research.splice(Number(el.dataset.i), 1); markDirty(); render(); },
  "add-question"() {
    const qs = state.company.questions = state.company.questions || [];
    let n = qs.length + 1;
    while (qs.some((q) => q.id === "q" + n)) n += 1;
    qs.push({ id: "q" + n, text: "", type: "free", limit: { min: null, max: 1000, count_mode: "with_space" }, use: [] });
    markDirty(); render();
  },
  "del-question"(el) {
    const q = state.company.questions[Number(el.dataset.i)];
    if (!confirm("문항 " + q.id + " 과(와) 그 답변을 삭제할까요?")) return;
    state.company.questions.splice(Number(el.dataset.i), 1);
    delete state.draft[q.id];
    markDirty(); render();
  },

  "use-subtitle"(el) {
    const answer = state.draft[state.activeQ];
    answer.subtitle = el.dataset.value;
    markDirty(); render();
  },
  "clear-answer"() {
    if (!confirm("이 문항의 본문을 비울까요?")) return;
    state.draft[state.activeQ] = { subtitle: "", body: "", used: [], note: "" };
    markDirty(); render();
  },
  "switch-company"(el) { activate(el.value); render(); },

  "add-company"() {
    const name = (prompt("추가할 회사 이름을 입력하세요", "") || "").trim();
    if (!name) return;
    const id = uid("co");
    state.spaces[id] = { name, draft: {},
      company: { name, position: "", team: "", talentProfile: [], coreCompetencies: [],
                 keywords: [], research: [], questions: [] } };
    activate(id);
    state.view = "company";
    state.isExample = false;
    markDirty(); render();
  },

  "delete-company"() {
    const ids = Object.keys(state.spaces);
    if (ids.length <= 1) { toast("마지막 회사는 지울 수 없습니다. 내용을 고쳐 쓰세요."); return; }
    const space = state.spaces[state.activeId];
    if (!confirm("'" + spaceLabel(space) + "'의 문항과 답변을 모두 지웁니다. 경력 노트는 그대로 둡니다. 계속할까요?")) return;
    const goneId = state.activeId;
    delete state.spaces[goneId];
    activate(Object.keys(state.spaces)[0]);
    if (db) db.doc("spaces/" + goneId).delete().catch(() => {});
    markDirty(); render();
  },
  "clear-all"() {
    if (!confirm("예시를 지우고 빈 상태로 시작할까요?")) return;
    state.career = { owner: { name: "", headline: "", years: null }, values: [], strengths: [], weaknesses: [], experiences: [] };
    state.company = { name: "", position: "", team: "", talentProfile: [], coreCompetencies: [], keywords: [], research: [], questions: [] };
    state.draft = {};
    state.view = "career";
    markDirty(); render();
  },

  async "copy-prompt"() {
    const q = (state.company.questions || []).find((x) => x.id === state.activeQ);
    if (!q) return;
    const plan = planQuestion(q, state.career, state.company);
    const text = systemPrompt() + "\n\n" + questionPrompt(plan);
    try {
      await navigator.clipboard.writeText(text);
      toast("프롬프트를 복사했습니다. Claude 앱에 붙여넣으세요.");
    } catch (e) {
      const box = document.getElementById("gen-slot");
      box.innerHTML = '<p class="note">아래 내용을 직접 복사하세요.</p><pre class="script">' + esc(text) + "</pre>";
    }
  },

  async generate() {
    if (state.generating) return;
    const q = (state.company.questions || []).find((x) => x.id === state.activeQ);
    if (!q || !q.text.trim()) { toast("문항 원문을 먼저 입력하세요."); return; }
    const sample = await useCap("sample");
    const slot = document.getElementById("gen-slot");
    if (!sample) {
      toast("이 화면에서는 자동 생성을 쓸 수 없습니다. '프롬프트 복사'를 사용하세요.");
      return;
    }
    const btn = document.getElementById("gen-btn");
    state.generating = q.id;
    btn.disabled = true;
    btn.textContent = "초안 작성 중…";
    slot.innerHTML = '<p class="note">Claude가 경력 노트의 재료만으로 쓰는 중입니다…</p><pre class="script" id="gen-stream">…</pre>';
    const stream = document.getElementById("gen-stream");
    const plan = planQuestion(q, state.career, state.company);
    try {
      const { text } = await sample(systemPrompt() + "\n\n" + questionPrompt(plan), {
        modelTier: "complex",
        cache: false,
        onText: ({ text }) => { stream.textContent = text; }
      });
      const parsed = parseDraft(text);
      const answer = state.draft[q.id] || (state.draft[q.id] = { subtitle: "", body: "", used: [] });
      if (parsed.subtitle) answer.subtitle = parsed.subtitle;
      if (parsed.body) answer.body = parsed.body;
      answer.note = parsed.todo;
      if (!(answer.used || []).length && plan.picks.length) answer.used = [plan.picks[0].m.exp.id];
      markDirty();
      state.generating = null;
      render();
      toast("초안이 들어왔습니다. 사실 여부를 직접 확인한 뒤 검증 탭을 보세요.");
    } catch (err) {
      state.generating = null;
      btn.disabled = false;
      btn.textContent = "Claude로 초안 만들기";
      const code = err && err.code;
      const message = code === "not_granted" ? "자동 생성 권한이 없습니다. '프롬프트 복사'를 사용하세요."
        : code === "rate_limited" ? "요청이 많습니다. 잠시 후 다시 시도하세요."
        : code === "cancelled" ? "생성을 취소했습니다."
        : "초안을 만들지 못했습니다. '프롬프트 복사'로 진행하세요.";
      slot.innerHTML = '<p class="note" style="color:var(--critical)">' + esc(message) + "</p>" +
        (err && err.text ? '<pre class="script">' + esc(err.text) + "</pre>" : "");
    }
  },

  "export-md"() {
    const name = (state.company.name || "자기소개서").replace(/[\\/:*?"<>|]/g, "");
    offerDownload(name + "_자기소개서.md", finalMarkdown());
  },
  "export-csv"() {
    const name = (state.company.name || "면접").replace(/[\\/:*?"<>|]/g, "");
    offerDownload(name + "_면접준비표.csv", interviewCSV());
  }
};

document.addEventListener("click", (event) => {
  const el = event.target.closest("[data-act]");
  if (!el) return;
  const action = ACTIONS[el.dataset.act];
  if (!action) return;
  if (el.tagName === "INPUT" || el.tagName === "SELECT") return;   // 체크박스·선택기는 change 에서
  event.preventDefault();
  action(el);
});

/* ══════════════════════════════════════════════════════════
   13. 시작
   ══════════════════════════════════════════════════════════ */

render();
loadWorkspace().then(render).catch(() => render());
</script>
