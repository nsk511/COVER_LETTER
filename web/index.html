<title>자소서 컨설팅 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* ── 토큰 ─────────────────────────────────────────────── */
  :root {
    color-scheme: light dark;
    --ink: #16212a;
    --ink-2: #2c3b45;
    --muted: #64757c;
    --paper: #f5f7f3;
    --surface: #ffffff;
    --surface-2: #eaeee7;
    --line: #d8ded5;
    --line-strong: #b6c0b5;
    --accent: #1f6f6b;
    --accent-ink: #ffffff;
    --accent-soft: #dcebe8;
    --critical: #a8443c;
    --critical-soft: #f7e4e1;
    --warn: #90691c;
    --warn-soft: #f5edd7;
    --ok: #3f7a46;
    --ok-soft: #e2efe0;
    --shadow: 0 1px 2px rgba(22, 33, 42, .06), 0 8px 24px -18px rgba(22, 33, 42, .5);
    --display: "Gowun Batang", "Nanum Myeongjo", serif;
    --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --r: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e6ece8;
      --ink-2: #b7c5c1;
      --muted: #869795;
      --paper: #0f1518;
      --surface: #182124;
      --surface-2: #1f2a2d;
      --line: #2b3639;
      --line-strong: #3d4a4d;
      --accent: #5fbfb2;
      --accent-ink: #0f1518;
      --accent-soft: #16302e;
      --critical: #e08a80;
      --critical-soft: #331e1c;
      --warn: #d3a95c;
      --warn-soft: #2d2517;
      --ok: #7fb587;
      --ok-soft: #1b2a1e;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -20px rgba(0, 0, 0, .9);
    }
  }
  :root[data-theme="dark"] {
    --ink: #e6ece8;
    --ink-2: #b7c5c1;
    --muted: #869795;
    --paper: #0f1518;
    --surface: #182124;
    --surface-2: #1f2a2d;
    --line: #2b3639;
    --line-strong: #3d4a4d;
    --accent: #5fbfb2;
    --accent-ink: #0f1518;
    --accent-soft: #16302e;
    --critical: #e08a80;
    --critical-soft: #331e1c;
    --warn: #d3a95c;
    --warn-soft: #2d2517;
    --ok: #7fb587;
    --ok-soft: #1b2a1e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -20px rgba(0, 0, 0, .9);
  }

  /* ── 기본 ─────────────────────────────────────────────── */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; }
  p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; }

  /* ── 머리말 ───────────────────────────────────────────── */
  .masthead {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    position: sticky; top: 0; z-index: 20;
  }
  .masthead .wrap {
    display: flex; align-items: center; gap: 16px;
    padding-block: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .brand h1 { font-family: var(--display); font-size: 20px; letter-spacing: -.01em; }
  .brand .sub {
    font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 100px;
    padding: 3px 11px; font-size: 12px; color: var(--ink-2); background: var(--surface);
  }
  .chip b { font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .dot.saved { background: var(--ok); }
  .dot.local { background: var(--warn); }
  .dot.dirty { background: var(--accent); }

  /* ── 레이아웃 ─────────────────────────────────────────── */
  .shell { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 28px; padding-block: 24px 64px; }
  nav.rail { position: sticky; top: 68px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
  nav.rail button {
    display: flex; align-items: baseline; gap: 9px; width: 100%;
    padding: 8px 10px; border: 0; border-radius: var(--r);
    background: transparent; color: var(--ink-2); cursor: pointer; text-align: left;
  }
  nav.rail button .step {
    font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 13px;
  }
  nav.rail button:hover { background: var(--surface-2); }
  nav.rail button[aria-current="true"] {
    background: var(--accent-soft); color: var(--ink); font-weight: 600;
  }
  nav.rail button[aria-current="true"] .step { color: var(--accent); }
  nav.rail .badge {
    margin-left: auto; font-family: var(--mono); font-size: 11px;
    color: var(--critical); font-weight: 500;
  }

  .panel { display: none; }
  .panel.on { display: block; }

  .panel-head { margin-bottom: 18px; }
  .panel-head h2 { font-family: var(--display); font-size: 24px; letter-spacing: -.01em; }
  .panel-head p { color: var(--muted); margin-top: 4px; max-width: 62ch; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 16px;
  }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }

  /* ── 폼 ───────────────────────────────────────────────── */
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  label.field > span em { font-style: normal; color: var(--accent); }
  input[type="text"], input[type="number"], input[type="url"], select, textarea {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 7px 9px; color: var(--ink); width: 100%;
  }
  textarea { resize: vertical; line-height: 1.8; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .btn {
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    border-radius: var(--r); padding: 6px 12px; cursor: pointer;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.quiet { border-color: transparent; color: var(--muted); padding-inline: 8px; }
  .btn.quiet:hover { color: var(--critical); background: var(--critical-soft); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }

  .tag-input { display: flex; flex-wrap: wrap; gap: 6px; }

  /* ── 표 ───────────────────────────────────────────────── */
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }

  /* ── 경험 카드 ────────────────────────────────────────── */
  .exp { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  .exp > summary {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    cursor: pointer; list-style: none;
  }
  .exp > summary::-webkit-details-marker { display: none; }
  .exp > summary .title { font-weight: 600; }
  .exp > summary .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .exp > summary .flags { margin-left: auto; display: flex; gap: 6px; }
  .exp[open] > summary { border-bottom: 1px solid var(--line); }
  .exp .body { padding: 14px; display: grid; gap: 12px; }
  .flag {
    font-size: 11px; padding: 1px 7px; border-radius: 100px; border: 1px solid var(--line);
    color: var(--muted);
  }
  .flag.gap { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
  .flag.conf { color: var(--critical); border-color: var(--critical); background: var(--critical-soft); }

  .metric-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr auto; gap: 6px; align-items: center; }

  /* ── 작성 화면 ────────────────────────────────────────── */
  .writer { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .qtext {
    font-family: var(--display); font-size: 17px; line-height: 1.55;
    padding-left: 12px; border-left: 2px solid var(--accent);
  }
  .counter { display: flex; align-items: baseline; gap: 10px; font-family: var(--mono); font-size: 12px; }
  .counter .big { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .counter .over { color: var(--critical); }
  .counter .under { color: var(--warn); }
  .counter .fit { color: var(--ok); }
  .gauge { height: 4px; background: var(--surface-2); border-radius: 100px; position: relative; overflow: hidden; }
  .gauge i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 100px; }
  .gauge i.over { background: var(--critical); }
  .gauge b { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--line-strong); }

  .material h4 {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); font-weight: 500; margin-bottom: 8px;
  }
  .pick { display: flex; gap: 9px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .pick:last-child { border-bottom: 0; }
  .pick .rank { font-family: var(--mono); font-size: 11px; color: var(--accent); padding-top: 2px; }
  .pick .why { font-size: 12px; color: var(--muted); }
  .para { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; font-size: 12px; align-items: baseline; }
  .para .share { font-family: var(--mono); color: var(--muted); }
  .para .guide { grid-column: 2 / -1; color: var(--muted); margin-bottom: 6px; }
  .sub-cand {
    display: block; width: 100%; text-align: left; border: 1px dashed var(--line-strong);
    background: transparent; border-radius: var(--r); padding: 6px 9px; margin-bottom: 5px;
    cursor: pointer; font-size: 12px;
  }
  .sub-cand:hover { border-style: solid; background: var(--accent-soft); }

  /* ── 검증 ─────────────────────────────────────────────── */
  .finding {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 12px;
    padding: 10px 12px 10px 14px; border-left: 3px solid var(--line-strong);
    background: var(--surface); border-radius: 0 var(--r) var(--r) 0; margin-bottom: 6px;
  }
  .finding.ERROR { border-left-color: var(--critical); background: var(--critical-soft); }
  .finding.WARN { border-left-color: var(--warn); background: var(--warn-soft); }
  .finding.INFO { border-left-color: var(--line-strong); }
  .finding .code {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    grid-row: 1 / span 3; padding-top: 2px;
  }
  .finding .msg { font-weight: 500; }
  .finding .ev, .finding .fix { font-size: 12px; color: var(--ink-2); }
  .finding .ev { font-family: var(--mono); color: var(--muted); }
  .score { display: flex; gap: 18px; align-items: baseline; font-family: var(--mono); }
  .score b { font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .score .e { color: var(--critical); }
  .score .w { color: var(--warn); }

  /* ── 면접 ─────────────────────────────────────────────── */
  .q-item { padding: 11px 0; border-bottom: 1px solid var(--line); display: grid; gap: 3px; }
  .q-item:last-child { border-bottom: 0; }
  .q-item .q { font-weight: 500; }
  .q-item .meta { font-size: 12px; color: var(--muted); }
  .risk { font-size: 11px; padding: 1px 7px; border-radius: 100px; font-family: var(--mono); }
  .risk.높음 { background: var(--critical-soft); color: var(--critical); }
  .risk.보통 { background: var(--warn-soft); color: var(--warn); }
  .risk.낮음 { background: var(--surface-2); color: var(--muted); }
  pre.script {
    font-family: var(--mono); font-size: 12px; line-height: 1.7; white-space: pre-wrap;
    background: var(--surface-2); border-radius: var(--r); padding: 12px; margin: 0;
  }

  .note { font-size: 12px; color: var(--muted); }
  .banner {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    border: 1px solid var(--warn); background: var(--warn-soft); color: var(--warn);
    border-radius: var(--r); padding: 9px 13px; margin-bottom: 18px; font-size: 13px;
  }
  .banner .btn { border-color: var(--warn); color: var(--warn); background: transparent; }
  .empty { color: var(--muted); padding: 22px; text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--r); }

  @media (max-width: 640px) {
    .brand .sub { display: none; }
    .brand h1 { font-size: 18px; }
  }
  @media (max-width: 900px) {
    .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    nav.rail {
      position: static; flex-direction: row; overflow-x: auto; gap: 4px;
      padding-bottom: 6px; border-bottom: 1px solid var(--line);
    }
    nav.rail button { width: auto; white-space: nowrap; }
    nav.rail .badge { margin-left: 4px; }
    .writer { grid-template-columns: minmax(0, 1fr); }
    .metric-row { grid-template-columns: 1fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="masthead">
  <div class="wrap">
    <div class="brand">
      <h1>자소서 컨설팅 데스크</h1>
      <span class="sub">career note → 자기소개서 → 면접</span>
    </div>
    <span class="chip" id="company-chip"><span class="dot"></span><b>회사 미설정</b></span>
    <span class="chip" id="save-chip"><span class="dot" id="save-dot"></span><span id="save-text">불러오는 중</span></span>
  </div>
</header>

<div class="wrap shell">
  <nav class="rail" id="rail" aria-label="작업 단계"></nav>

  <main id="main">
    <div id="banner-slot"></div>

    <section class="panel" id="panel-career" aria-labelledby="h-career"></section>
    <section class="panel" id="panel-company" aria-labelledby="h-company"></section>
    <section class="panel" id="panel-match" aria-labelledby="h-match"></section>
    <section class="panel" id="panel-write" aria-labelledby="h-write"></section>
    <section class="panel" id="panel-lint" aria-labelledby="h-lint"></section>
    <section class="panel" id="panel-interview" aria-labelledby="h-interview"></section>
  </main>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   1. 규칙 데이터 — 인재상 사전, 문단 설계, 검증 규칙
   ══════════════════════════════════════════════════════════ */

const AXES = {
  "도전·혁신": {
    aliases: ["도전", "챌린지", "혁신", "개척", "변화", "선도", "진취", "프론티어", "창조", "도전정신"],
    signals: ["처음", "최초", "신규", "새로운", "시도", "제안", "개선", "바꾸", "도입", "전환", "재설계", "자동화"],
    probes: ["기존 방식을 바꾸자고 먼저 제안한 경험이 있나요? 반대는 없었나요?",
             "실패할 수도 있었던 시도 중 가장 위험했던 것은 무엇이었나요?"] },
  "전문성": {
    aliases: ["전문성", "프로페셔널", "전문가", "실력", "역량", "프로", "최고"],
    signals: ["자격", "분석", "설계", "검증", "산출", "모델", "논문", "스터디", "시험", "합격", "심화", "원리"],
    probes: ["본인이 가진 전문성을 한 문장으로 정의한다면 무엇인가요?",
             "그 분야에서 최근에 새로 배운 것은 무엇인가요?"] },
  "고객중심": {
    aliases: ["고객", "고객중심", "고객가치", "소비자", "고객만족", "고객제일"],
    signals: ["고객", "현업", "사용자", "담당자", "요청", "니즈", "불만", "민원", "상담", "현장"],
    probes: ["고객(또는 현업)의 요구와 원칙이 충돌했을 때 어떻게 했나요?",

  "협업·소통": {
    aliases: ["협업", "소통", "팀워크", "함께", "시너지", "화합", "동료", "커뮤니케이션", "원팀"],
    signals: ["협업", "협의", "회의", "설득", "조율", "공유", "함께", "팀", "부서", "유관", "인수인계", "교육"],
    probes: ["의견이 끝까지 좁혀지지 않았던 상대를 어떻게 설득했나요?",
             "협업에서 본인이 맡은 역할은 정확히 무엇이었나요?"] },
  "정직·신뢰": {
    aliases: ["정직", "신뢰", "윤리", "진정성", "책임", "준법", "원칙", "투명"],
    signals: ["검증", "이중", "교차", "확인", "원칙", "규정", "감사", "리스크", "오류", "정합성", "재현"],
    probes: ["실수를 먼저 밝혀야 했던 상황이 있었나요? 어떻게 했나요?",
             "숫자가 틀렸다는 걸 뒤늦게 알았을 때 어떤 절차를 밟나요?"] },
  "데이터·분석": {
    aliases: ["데이터", "분석", "디지털", "DT", "AI", "통계", "데이터기반", "인사이트"],
    signals: ["SQL", "쿼리", "데이터", "통계", "산출", "집계", "모형", "모델링", "검증", "추정", "엑셀", "파이썬", "지표"],
    probes: ["분석 결과가 직관과 달랐을 때 어떻게 판단했나요?", "데이터 품질 문제를 발견한 경험이 있나요?"] },
  "실행력·책임감": {
    aliases: ["실행", "실행력", "책임", "주인의식", "끈기", "완수", "성실", "오너십"],
    signals: ["마감", "기한", "일정", "완료", "끝까지", "단독", "담당", "주도", "마무리", "재작업"],
    probes: ["아무도 시키지 않았는데 끝까지 마무리한 일이 있나요?",
             "일정이 불가능해 보였을 때 무엇을 포기하고 무엇을 지켰나요?"] },
  "성장·학습": {
    aliases: ["성장", "학습", "배움", "자기계발", "발전", "인재육성"],
    signals: ["학습", "공부", "자격증", "시험", "스터디", "독학", "교육", "습득", "익힌", "강의"],

/* ══════════════════════════════════════════════════════════
   2. 텍스트 유틸
   ══════════════════════════════════════════════════════════ */

const NUM_RE = /(?<![\w가-힣])(\d[\d,]*(?:\.\d+)?)\s*(%|퍼센트|배|억|만|천|원|건|명|개|년|개월|주|일|시간|분|초|회차|회|차|위|점|급|학기|세트|번|종|가지|kg|km)?/g;

const flat = (s) => (s || "").replace(/\s+/g, "").toLowerCase();

function countChars(text) {
  const t = (text || "").replace(/\r\n?/g, "\n");
  return { withSpace: t.length, withoutSpace: t.replace(/\s+/g, "").length };
}
const countFor = (text, mode) => mode === "without_space" ? countChars(text).withoutSpace : countChars(text).withSpace;

function splitSentences(text) {
  return (text || "").replace(/\r\n?/g, "\n")
    .split(/(?<=[.!?])\s+|(?<=다\.)\s*|\n+/)
    .map((s) => s.trim()).filter(Boolean);
}

function extractNumbers(text) {
  const out = [];
  for (const m of (text || "").matchAll(NUM_RE)) {
    const token = m[1] + (m[2] || "");
    if (!out.includes(token)) out.push(token);
  }
  return out;
}
const canonNum = (t) => flat(t).replace(/,/g, "").replace("퍼센트", "%");
const bareNum = (t) => (canonNum(t).match(/^[\d.]+/) || [""])[0].replace(/\.$/, "");

function hits(text, needles) {
  const f = flat(text);
  return (needles || []).filter((n) => n && f.includes(flat(n)));
}

function truncate(text, n = 44) {
  const t = (text || "").replace(/\s+/g, " ").trim();
  return t.length <= n ? t : t.slice(0, n - 1) + "…";
}

function euroParticle(word) {           /* 로 / 으로 */
  const last = (word || "").slice(-1);
  if (!(last >= "가" && last <= "힣")) return "(으)로";
  const jong = (last.charCodeAt(0) - 0xac00) % 28;
  return jong === 0 || jong === 8 ? "로" : "으로";   /* 받침 없음 또는 ㄹ 받침 */
}

/* 시간 단위 — '1시간'과 '60분'이 같은 값임을 알아야 모순을 판별할 수 있다 */
const TIME_UNITS = { "초": 1 / 60, "분": 1, "시간": 60, "일": 1440 };
const AFTER_UNIT = "(?=[\\s,.)\\]]|$|이|가|을|를|에|으|까|은|는|의|만|도|씩|와|과|짜|부터|→|~)";
const TIME_RE = new RegExp("(\\d[\\d,]*(?:\\.\\d+)?)\\s*(초|분|시간|일)" + AFTER_UNIT, "g");
const TRANSITION_RE = new RegExp(
  "(\\d[\\d,]*(?:\\.\\d+)?)\\s*(초|분|시간|일)\\s*(?:에서|부터|→|~)\\s*(\\d[\\d,]*(?:\\.\\d+)?)\\s*(초|분|시간|일)", "g");

const toMinutes = (n, unit) => parseFloat(String(n).replace(/,/g, "")) * TIME_UNITS[unit];

function timeValues(text) {
  const out = [];
  for (const m of (text || "").matchAll(TIME_RE)) out.push([m[0].trim(), toMinutes(m[1], m[2])]);
  return out;
}

function timeTransitions(text) {
  const out = [];
  for (const m of (text || "").matchAll(TRANSITION_RE)) {
    out.push([m[0].trim(), toMinutes(m[1], m[2]), toMinutes(m[3], m[4])]);
  }
  return out;
}

function timeEquivalents(token) {
  const m = new RegExp("^(\\d[\\d,]*(?:\\.\\d+)?)\\s*(초|분|시간|일)$").exec(canonNum(token));
  if (!m) return [];
  const minutes = toMinutes(m[1], m[2]);
  return Object.entries(TIME_UNITS).map(([unit, factor]) => canonNum(String(minutes / factor) + unit));
}

const fmtMinutes = (m) => (m >= 60 && m % 60 === 0) ? (m / 60) + "시간" : m + "분";

function particle(word, withFinal, withoutFinal) {
  const last = (word || "").slice(-1);
  if (!(last >= "가" && last <= "힣")) return withFinal + "(" + withoutFinal + ")";
  return (last.charCodeAt(0) - 0xac00) % 28 !== 0 ? withFinal : withoutFinal;
}

const esc = (s) => (s == null ? "" : String(s)).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const uid = (p) => p + "-" + Math.random().toString(36).slice(2, 7);

/* ══════════════════════════════════════════════════════════
   3. 매칭 — 인재상 해석과 경험 점수
   ══════════════════════════════════════════════════════════ */

/* 문항이 요구하는 축에 주는 가중치 — 관련성이 점수를 지배하게 한다 */
const PREFERRED_AXIS_WEIGHT = 3;

function expText(e) {
  return [e.title, e.role, e.situation, e.task, e.action, e.result, e.insight, e.difficulty,
    e.collaboration, e.lesson, (e.domain || []).join(" "), (e.keywords || []).join(" "),
    (e.axes || []).join(" "),
    (e.metrics || []).map((m) => [m.name, m.before, m.after, m.delta].filter(Boolean).join(" ")).join(" ")
  ].filter(Boolean).join("\n");
}

function starGaps(e) {
  const gaps = [];
  if (!e.situation) gaps.push("상황");
  if (!e.task) gaps.push("과제");
  if (!e.action) gaps.push("행동");
  if (!e.result) gaps.push("결과");
  if (!(e.metrics || []).length) gaps.push("정량 성과");
  if (!e.insight) gaps.push("도메인 통찰");
  return gaps;
}

function resolveAxes(company) {
  const out = [];
  const seen = new Set();
  for (const phrase of company.talentProfile || []) {
    if (!phrase) continue;
    let best = null;
    for (const [name, spec] of Object.entries(AXES)) {
      const found = hits(phrase, spec.aliases.concat([name]));
      if (!found.length) continue;
      const strength = Math.max(...found.map((h) => flat(h).length));
      if (!best || strength > best[0]) best = [strength, name];
    }
    if (best) {
      const name = best[1];
      if (seen.has(name)) {
        const prev = out.find((a) => a.axis === name);
        if (prev && !prev.source.includes(phrase)) prev.source += " / " + phrase;
        continue;
      }
      seen.add(name);
      out.push({ source: phrase, axis: name, signals: AXES[name].signals, probes: AXES[name].probes, mapped: true });
    } else {
      if (seen.has(phrase)) continue;
      seen.add(phrase);
      const tokens = phrase.replace(/[^\p{L}\p{N}]+/gu, " ").split(" ").filter((t) => t.length >= 2);
      out.push({ source: phrase, axis: phrase, signals: tokens, mapped: false,
        probes: ["'" + phrase + "'에 해당하는 본인의 경험을 말해보세요."] });
    }
  }
  if (!out.length) {
    /* 인재상을 아직 모르는 회사도 많다. 축 점수를 0으로 두면 문항 유형별
       선호축이 통째로 죽으므로, 표준 역량축 전체를 기본값으로 쓴다. */
    return Object.entries(AXES).map(([axis, spec]) => ({
      source: DEFAULT_AXIS_SOURCE, axis, signals: spec.signals, probes: spec.probes, mapped: true
    }));
  }
  return out;
}

const DEFAULT_AXIS_SOURCE = "(인재상 미입력 — 표준 역량축 사용)";
const usingDefaultAxes = (company) => !(company.talentProfile || []).filter(Boolean).length;

function scoreExperience(exp, axes, company) {
  const text = expText(exp);
  const m = { exp, axisScores: {}, axisHits: {}, jobFit: 0, jobHits: [], bonuses: [] };
  for (const axis of axes) {
    const found = hits(text, axis.signals);
    let score = found.length;
    let shown = found.slice();
    if ((exp.axes || []).includes(axis.axis)) { score += 4; shown = shown.concat(["직접 지정"]); }
    m.axisScores[axis.axis] = score;
    m.axisHits[axis.axis] = shown;
  }
  m.jobHits = hits(text, (company.coreCompetencies || []).concat(company.keywords || []));
  m.jobFit = m.jobHits.length * 3;
  if ((exp.metrics || []).length) { m.jobFit += 2; m.bonuses.push("정량 성과 있음"); }
  if (exp.insight) { m.jobFit += 2; m.bonuses.push("도메인 통찰 있음"); }
  if (exp.confidential) m.bonuses.push("대외비 — 익명화 필요");
  if (exp.verified === false) m.bonuses.push("사실 확인 필요");
  m.total = Object.values(m.axisScores).reduce((a, b) => a + b, 0) + m.jobFit;
  return m;
}

function matchAll(career, company) {
  const axes = resolveAxes(company);
  return (career.experiences || []).map((e) => scoreExperience(e, axes, company))
    .sort((a, b) => b.total - a.total || a.exp.id.localeCompare(b.exp.id));
}

function topAxes(m, n = 3) {
  return Object.entries(m.axisScores).filter(([, s]) => s > 0).sort((a, b) => b[1] - a[1]).slice(0, n);
}

function evidenceOf(m) {
  const out = topAxes(m).map(([name, score]) => {
    const h = (m.axisHits[name] || []).slice(0, 4);
    return name + " " + score + "점" + (h.length ? " (" + h.join(", ") + ")" : "");
  });
  if (m.jobHits.length) out.push("직무 키워드: " + m.jobHits.slice(0, 4).join(", "));
  return out.concat(m.bonuses);
}

function recommend(career, company, question, limit = 3) {
  const spec = QUESTION_TYPES[question.type] || QUESTION_TYPES.free;
  const qTokens = (question.text || "").replace(/[^\p{L}\p{N}]+/gu, " ").split(" ").filter((t) => t.length >= 2);
  const preferred = new Set(spec.axes);
  return matchAll(career, company).map((m) => {
    /* 모든 축을 같은 무게로 더하면 '내용이 많은 경험'이 문항과 무관하게 1등이 된다 */
    let score = m.jobFit;
    const why = [];
    for (const [axisName, gained] of Object.entries(m.axisScores)) {
      if (!gained) continue;
      const weight = preferred.has(axisName) ? PREFERRED_AXIS_WEIGHT : 1;
      score += gained * weight;
      if (preferred.has(axisName)) why.push(spec.label + " 선호축 " + axisName + " " + gained + "×" + weight);
    }
    for (const f of spec.fields) {
      const v = f === "metrics" ? (m.exp.metrics || []).length : m.exp[f];
      if (v) { score += 2; why.push(f + " 작성됨 +2"); }
    }
    const kw = hits(expText(m.exp), qTokens);
    if (kw.length) { score += kw.length; why.push("문항 키워드 일치: " + kw.slice(0, 4).join(", ")); }
    if ((question.use || []).includes(m.exp.id)) { score += 100; why.unshift("직접 지정"); }
    return { m, score, why };
  }).sort((a, b) => b.score - a.score).slice(0, limit);
}

function coverage(career, company) {
  const out = {};
  for (const axis of resolveAxes(company)) {
    out[axis.axis] = (career.experiences || [])
      .filter((e) => scoreExperience(e, [axis], company).axisScores[axis.axis] >= 2)
      .map((e) => e.id);
  }
  return out;
}

/* ══════════════════════════════════════════════════════════
   4. 문항 설계
   ══════════════════════════════════════════════════════════ */

function targetChars(q) {
  const { min, max } = q.limit || {};
  if (max && min) return Math.round((max + min) / 2);
  if (max) return Math.round(max * 0.92);
  if (min) return Math.round(min * 1.1);
  return 800;
}

function subtitleCandidates(exp, question, company) {
  if (!exp) return [];
  /* 변화를 보여주는 짧은 수치를 우선한다 */
  const short = (exp.metrics || []).filter((m) => (m.delta || "").length <= 20 && (m.after || "").length <= 20);
  const metric = short.find((m) => m.delta) || short.find((m) => m.before && m.after) || short[0];
  let result = "";
  if (metric) {
    if (metric.delta) result = metric.delta;
    else if (metric.before && metric.after) result = metric.name + " " + metric.before + "→" + metric.after;
    else result = (metric.name + " " + (metric.after || "")).trim();
  }
  result = result || (exp.result || "").slice(0, 20);
  const method = (exp.title || "").split(" ")[0] || exp.role || "";
  const out = [];
  if (question.type === "motivation") {
    out.push(((exp.domain || [])[0] || "현장") + "에서 확인한 기준, " + (company.name || "이 회사") + "에서 잇겠습니다");
  }
  if (result && exp.insight) {
    const head = (exp.insight.split(/[.,]/)[0] || "").trim();
    if (head.length >= 6 && head.length <= 30) out.push(head + ", " + result);
  }
  if (result && method) out.push(method + euroParticle(method) + " " + result);
  if (exp.title) out.push(truncate(exp.title, 40));
  return out.filter(Boolean).slice(0, 4);
}

function planQuestion(question, career, company) {
  const spec = QUESTION_TYPES[question.type] || QUESTION_TYPES.free;
  const target = targetChars(question);
  const picks = recommend(career, company, question);
  const primary = picks.length ? picks[0].m.exp : null;
  const warnings = [];
  if (!picks.length) warnings.push("추천할 경험이 없습니다. 경력 노트를 먼저 채우세요.");
  else if (picks[0].score < 10) warnings.push("이 문항에 뚜렷하게 맞는 경험이 없습니다. 경험을 추가하거나 직접 지정하세요.");
  if (primary && starGaps(primary).length) {
    warnings.push("주 경험 " + primary.id + " 의 " + starGaps(primary).join(", ") + " 이(가) 비어 있습니다.");
  }
  if (question.type === "motivation" && !usableResearch(company).length) {
    warnings.push("확인된 회사 리서치가 없습니다. 지원동기는 리서치 없이 쓰지 않습니다.");
  }
  if (!(question.limit || {}).max && !(question.limit || {}).min) warnings.push("글자수 제한이 입력되지 않았습니다.");
  return {
    question, target, picks, warnings,
    paragraphs: spec.paragraphs.map(([name, share, guide]) =>
      ({ name, share, guide, chars: Math.round(target * share / 100) })),
    subtitles: subtitleCandidates(primary, question, company)
  };
}

function planAll(career, company) {
  const plans = (company.questions || []).map((q) => planQuestion(q, career, company));
  /* 한 경험이 여러 문항의 주 경험으로 몰리면 '이야깃거리가 하나뿐'으로 읽힌다 */
  const count = {};
  plans.forEach((p) => { const e = p.picks[0] && p.picks[0].m.exp.id; if (e) count[e] = (count[e] || 0) + 1; });
  for (const plan of plans) {
    const primary = plan.picks[0] && plan.picks[0].m.exp;
    if (!primary || count[primary.id] < 2) continue;
    const where = plans.filter((x) => x.picks[0] && x.picks[0].m.exp.id === primary.id)
      .map((x) => x.question.id).join(", ");
    const alt = (plan.picks.slice(1).find((x) => !count[x.m.exp.id]) || {}).m;
    plan.warnings.push("주 경험 '" + (primary.title || primary.id) + "' 이(가) " + count[primary.id] +
      "개 문항(" + where + ")의 1순위입니다." +
      (alt ? " 겹치지 않는 대안: " + (alt.exp.title || alt.exp.id)
           : " 겹치지 않는 대안이 없습니다 — 경력 노트에 경험을 더 추가하세요."));
  }
  return plans;
}

const usableResearch = (company) => (company.research || []).filter((r) => r.claim && r.source && r.checked);

/* ══════════════════════════════════════════════════════════
   5. 검증
   ══════════════════════════════════════════════════════════ */

function allowedNumbers(career, company, question) {
  const set = new Set();
  const add = (text) => extractNumbers(text).forEach((t) => {
    set.add(canonNum(t)); set.add(bareNum(t));
    timeEquivalents(t).forEach((e) => set.add(e));   /* 90분 ≡ 1.5시간 */
  });
  (career.experiences || []).forEach((e) => add(expText(e)));
  (career.strengths || []).concat(career.weaknesses || []).forEach((t) => add([t.label, t.detail, t.improving].join(" ")));
  (career.values || []).forEach(add);
  (company.research || []).forEach((r) => add(r.claim + " " + (r.date || "")));
  add(question.text);
  return set;
}

function lintAnswer(question, answer, career, company) {
  const out = [];
  const push = (rule, level, message, fix, ev) => out.push({ rule, level, message, fix: fix || "", ev: ev || "", qid: question.id });
  const body = answer.body || "";
  const full = (answer.subtitle ? "[" + answer.subtitle + "]\n" : "") + body;

  if (!body.trim()) { push("EMPTY", "ERROR", "본문이 비어 있습니다"); return out; }

  /* 글자수 */
  const c = countChars(full);
  const limit = question.limit || {};
  const mode = limit.count_mode === "without_space" ? "without_space" : "with_space";
  const modeLabel = mode === "with_space" ? "공백포함" : "공백제외";
  const actual = countFor(full, mode);
  if (limit.max && actual > limit.max) {
    push("LEN", "ERROR", "글자수 초과: " + actual + "자 / 최대 " + limit.max + "자(" + modeLabel + ") — " + (actual - limit.max) + "자 줄여야 합니다",
      "회사 설명·수식어부터 줄이고 본인 행동과 결과는 남깁니다");
  } else if (limit.min && actual < limit.min) {
    push("LEN", "ERROR", "글자수 미달: " + actual + "자 / 최소 " + limit.min + "자(" + modeLabel + ") — " + (limit.min - actual) + "자 더 필요합니다",
      "'어려웠던 점'과 '왜 그 방법이 가능했는지'를 보강하면 자연스럽게 늘어납니다");
  } else if (limit.max && !limit.min && actual < limit.max * 0.8) {
    push("LEN", "WARN", "분량 여유: " + actual + "자 / 최대 " + limit.max + "자(" + modeLabel + ") — 80% 미만입니다",
      "제한의 90% 내외까지 채우는 것이 일반적입니다");
  } else {
    push("LEN", "INFO", "글자수 " + actual + "자 · 공백포함 " + c.withSpace + " / 공백제외 " + c.withoutSpace);
  }

  /* 소제목 */
  if (!answer.subtitle) {
    push("SUB", "ERROR", "소제목이 없습니다", "기본 공식 [방법(how)] + [결과(result)]");
  } else {
    const hasResult = hits(answer.subtitle, ["줄", "단축", "개선", "높", "낮", "확보", "해결", "만들", "없앤", "0건", "%", "배", "시간", "달성", "이끈", "바꾼"]).length > 0;
    const hasMethod = hits(answer.subtitle, ["로", "으로", "통해", "한", "하여", "써서", "재설계", "표준화", "분석"]).length > 0;
    const formulaTypes = ["achievement", "challenge", "collaboration", "strength", "strength_weakness"];
    if (formulaTypes.includes(question.type) && !(hasResult && hasMethod)) {
      const missing = [];
      if (!hasMethod) missing.push("방법(how)");
      if (!hasResult) missing.push("결과(result)");
      push("SUB", "WARN", "소제목에 " + missing.join(", ") + " 가 드러나지 않습니다: 「" + answer.subtitle + "」",
        "예) '집계 단위를 바꿔 산출 시간을 78% 줄인 경험'");
    }
    if (company.team && answer.subtitle.includes(company.team)) {
      push("SUB", "WARN", "소제목이 특정 팀(" + company.team + ")에만 해당하는 표현입니다",
        "모집부문이 여러 팀이면 좁은 표현은 피합니다");
    }
  }

  /* 지어낸 수치 */
  const allowed = allowedNumbers(career, company, question);
  const noteTimes = new Map(timeValues((career.experiences || []).map(expText).join("\n"))
    .map(([token, value]) => [value, token]));
  for (const token of extractNumbers(full)) {
    if (allowed.has(canonNum(token)) || allowed.has(bareNum(token))) continue;
    let fix = "실제 수치로 고치거나, 근거를 경력 노트에 먼저 추가하세요. 지어낸 숫자는 면접에서 바로 무너집니다";
    const mine = timeValues(token);
    if (mine.length && noteTimes.size) {
      const nearest = [...noteTimes.keys()].sort((a, b) =>
        Math.abs(a - mine[0][1]) - Math.abs(b - mine[0][1]))[0];
      fix = "경력 노트에는 「" + noteTimes.get(nearest) + "」로 적혀 있습니다. 어느 쪽이 맞는지 확인하세요";
    }
    push("NUM", "ERROR", "경력 노트에 없는 수치입니다: 「" + token + "」", fix);
  }

  /* 같은 답변 안에서 수치가 어긋나는지 — '90분이 걸렸다 … 1시간에서 20분으로' */
  for (const [phrase, start, end] of timeTransitions(full)) {
    const others = [...new Set(timeValues(full)
      .filter(([token, value]) => value !== start && value !== end && !phrase.includes(token))
      .map(([, value]) => value))];
    if (!others.length || others.includes(start)) continue;
    const bigger = others.filter((v) => v > end).sort((a, b) => b - a);
    if (!bigger.length) continue;
    const joined = bigger.map(fmtMinutes).join(", ");
    push("CONTRA", "ERROR",
      "같은 답변 안에서 수치가 어긋납니다: 「" + phrase + "」의 시작값(" + fmtMinutes(start) +
      ")이 앞에서 말한 " + joined + particle(joined, "과", "와") + " 다릅니다",
      "둘 중 실제 값 하나로 통일하세요. 앞뒤가 다른 숫자는 면접에서 가장 먼저 지적당합니다",
      truncate(phrase, 40));
  }

  /* 띄어쓰기 — 더 긴 규칙이 잡은 자리는 다시 지적하지 않는다 */
  const covered = [];
  for (const [wrong, right, why] of [...SPACING].sort((a, b) => b[0].length - a[0].length)) {
    const at = full.indexOf(wrong);
    if (at < 0) continue;
    const end = at + wrong.length;
    if (covered.some(([a, b]) => at >= a && end <= b)) continue;
    covered.push([at, end]);
    push("SPACING", "WARN", "띄어쓰기: 「" + wrong + "」 → 「" + right + "」", why);
  }
  if (full.replace(/\n/g, "").includes("  ")) {
    push("SPACING", "WARN", "공백이 두 칸 이상 들어간 곳이 있습니다",
      "복사·붙여넣기에서 자주 생깁니다. 제출 전 한 번 정리하세요");
  }

  /* 클리셰 / 근무 외 시간 */
  for (const [phrase, why] of CLICHES) {
    if (hits(full, [phrase]).length) push("CLICHE", "WARN", "뭉뚱그린 표현: 「" + phrase + "」", why);
  }
  for (const hit of hits(full, OVERTIME)) {
    push("OVERTIME", "WARN", "근무 외 시간을 강조하는 표현: 「" + hit + "」",
      "'언제 했는지'보다 '무엇을 분석해 무엇을 바꿨는지'로 씁니다");
  }

  /* 치명적 약점 */
  if (question.type === "strength_weakness") {
    for (const pattern of FATAL_WEAKNESS) {
      if (!hits(full, [pattern]).length) continue;
      const sentence = splitSentences(full).find((s) => flat(s).includes(flat(pattern))) || "";
      const core = hits(sentence, company.coreCompetencies || []);
      push("WEAK", core.length ? "ERROR" : "WARN",
        "단정형 약점 표현: 「" + pattern + "」" + (core.length ? " — 직무 핵심역량(" + core.join(", ") + ")과 직결됩니다" : ""),
        "'부족했다'가 아니라 '~에 집중하다 보니 ~하는 데 더 많은 노력이 필요했다'로 톤을 조정하고, 관련 경험이 있다면 개선 중인 지점으로 씁니다",
        truncate(sentence, 60));
      break;
    }
  }

  /* 회사 사실 검증 */
  const usable = usableResearch(company);
  for (const sentence of splitSentences(full)) {
    if (!company.name || !sentence.includes(company.name)) continue;
    if (!hits(sentence, FACT_MARKERS).length) continue;
    const supported = usable.some((r) => {
      const tokens = r.claim.split(/[\s,]+/).filter((t) => t.length >= 2);
      return tokens.length && hits(sentence, tokens).length;
    });
    if (!supported) {
      push("FACT", "ERROR", "출처로 확인되지 않은 회사 관련 주장입니다",
        "회사·문항 탭의 리서치에 출처를 넣고 '확인 완료'로 표시하거나, 문장을 삭제하세요", truncate(sentence, 60));
    }
  }
  if (question.type === "motivation") {
    const unchecked = (company.research || []).filter((r) => r.claim && !r.checked);
    if (unchecked.length) {
      push("FACT", "WARN", "미확인 리서치 " + unchecked.length + "건이 남아 있습니다",
        "지원 시점 기준 최신(가급적 올해) 자료인지 확인한 뒤 '확인 완료'로 바꾸세요",
        unchecked.slice(0, 3).map((r) => truncate(r.claim, 28)).join("; "));
    }
  }

  /* 지원동기 비중 */
  if (question.type === "motivation") {
    const sentences = splitSentences(body);
    const markers = STORY_MARKERS.concat(company.name ? [company.name] : []);
    const total = sentences.reduce((a, s) => a + s.length, 0);
    const story = sentences.filter((s) => hits(s, markers).length).reduce((a, s) => a + s.length, 0);
    const share = total ? story / total : 0;
    if (share > 0.5) {
      push("BALANCE", "ERROR", "회사 이야기 비중이 " + Math.round(share * 100) + "%입니다 (기준 50% 이하)",
        "회사 연혁·철학은 한두 문장 배경으로 줄이고, 절반 이상을 본인 경험과 포부에 씁니다");
    } else if (share > 0.35) {
      push("BALANCE", "WARN", "회사 이야기 비중 " + Math.round(share * 100) + "% — 조금 더 줄이는 편이 안전합니다");
    }
  }

  /* 문장 길이 */
  const sentences = splitSentences(body);
  const long = sentences.filter((s) => s.length > MAX_SENT);
  if (long.length && long.length / sentences.length > 0.25) {
    push("SENT", "WARN", MAX_SENT + "자를 넘는 긴 문장이 " + long.length + "/" + sentences.length + "개입니다",
      "한 문장에 한 가지만 담으면 읽는 속도가 빨라집니다", truncate(long[0], 50));
  }

  /* 근거 경험 */
  for (const id of answer.used || []) {
    const exp = (career.experiences || []).find((e) => e.id === id);
    if (!exp) { push("REF", "ERROR", "존재하지 않는 경험을 참조합니다: " + id); continue; }
    if (exp.confidential) push("REF", "WARN", "대외비로 표시된 경험을 사용했습니다: " + (exp.title || id),
      "고객사명 등은 'A사', '대형 손해보험사'처럼 일반화하세요");
    if (exp.verified === false) push("REF", "WARN", "사실 확인이 끝나지 않은 경험입니다: " + (exp.title || id));
  }
  if (!(answer.used || []).length && question.type !== "social_issue") {
    push("REF", "INFO", "근거 경험이 지정되지 않았습니다", "어느 경험에 근거한 답변인지 표시해 두면 수치 검증과 면접 준비가 쉬워집니다");
  }
  return out;
}

function lintAll(career, company, draft) {
  const findings = [];
  for (const q of company.questions || []) {
    const a = draft[q.id];
    if (!a || !(a.body || "").trim()) {
      findings.push({ rule: "MISSING", level: "ERROR", qid: q.id, message: "답변이 없습니다", fix: "", ev: truncate(q.text, 50) });
      continue;
    }
    findings.push(...lintAnswer(q, a, career, company));
  }
  return findings;
}

/* ══════════════════════════════════════════════════════════
   6. 면접 질문 역산
   ══════════════════════════════════════════════════════════ */

const CONFLICT = ["반대", "이견", "갈등", "충돌", "거절", "설득"];
const COLLAB = ["협업", "설득", "합의", "조율", "함께", "팀", "부서", "현업", "회의", "공유"];
const LEAD = ["주도", "제안", "이끌", "총괄", "리드", "먼저"];

function buildInterview(career, company, draft) {
  const items = [];
  const add = (o) => items.push(Object.assign({ risk: "보통", source: "", prep: "" }, o));

  for (const axis of resolveAxes(company)) {
    for (const probe of axis.probes || []) {
      add({ category: "인재상 · " + axis.axis, question: probe, source: "인재상 원문: " + axis.source,
        prep: "해당 축을 뒷받침하는 경험 1개를 STAR로 60초 분량 준비", risk: axis.mapped ? "보통" : "높음" });
    }
  }
  add({ category: "직무 이해", question: (company.position || "이 직무") + "에서 가장 어려운 점이 무엇이라고 생각하나요?",
    prep: "업무 흐름 이해를 보여주는 어려움 1개 + 본인 경험에서 비슷하게 겪은 지점", risk: "높음" });
  for (const comp of (company.coreCompetencies || []).slice(0, 5)) {
    add({ category: "직무 이해", question: "'" + comp + "' 관련해서 해본 일이 있다면 말해 주세요. 없다면 어떻게 준비하고 있나요?",
      prep: "있으면 STAR 30초 / 없으면 '현재 경험 + 배우고 싶은 이유'로 과장 없이" });
  }

  const usedIds = [];
  for (const q of company.questions || []) {
    const a = draft[q.id];
    if (!a || !(a.body || "").trim()) continue;
    usedIds.push(...(a.used || []));
    const full = (a.subtitle ? "[" + a.subtitle + "]\n" : "") + a.body;
    const seenTerms = new Set();

    for (const sentence of splitSentences(full)) {
      /* 단위 없는 한두 자리 숫자('1', '3')는 성과 수치가 아니라 잡음이다 */
      const nums = extractNumbers(sentence).filter((n) => !/^\d{1,2}$/.test(n));
      if (nums.length) {
        const joined = nums.slice(0, 3).join(", ");
        add({ category: "수치 검증", risk: "높음",
          question: "「" + joined + "」" + particle(joined, "은", "는") +
            " 어떻게 측정한 숫자인가요? 계산 기준과 대상 기간을 설명해 주세요.",
          source: truncate(sentence, 60),
          prep: "① 무엇을 기준으로 쟀는지 ② 비교 대상(before)이 무엇인지 ③ 그 숫자를 확인한 방법" });
      }
      for (const term of hits(sentence, DOMAIN_TERMS)) {
        if (seenTerms.has(term)) continue;
        seenTerms.add(term);
        add({ category: "도메인 지식", risk: "높음",
          question: "자소서에 쓴 '" + term + "'" + particle(term, "이", "가") + " 무엇인지, 업무에서 어떤 의미였는지 설명해 주세요.",
          source: truncate(sentence, 60),
          prep: term + "의 정의 한 문장 + 본인 업무에서의 역할 한 문장 + 실제로 다뤄본 사례 한 문장" });
      }
      if (hits(sentence, CONFLICT).length) {
        add({ category: "협업·갈등", risk: "높음",
          question: "반대한 사람은 누구였고, 무엇을 근거로 설득했나요? 끝내 합의가 안 됐다면 어떻게 했을까요?",
          source: truncate(sentence, 60), prep: "상대의 입장 → 내가 제시한 근거(데이터/사례) → 최종 합의안 → 이후 관계" });
      } else if (hits(sentence, COLLAB).length) {
        add({ category: "협업·갈등", question: "그 협업에서 본인이 직접 한 일과 다른 사람이 한 일을 나눠서 말해 주세요.",
          source: truncate(sentence, 60), prep: "내 역할(동사로) / 상대 역할 / 내가 없었으면 달라졌을 결과" });
      }
      if (hits(sentence, LEAD).length) {
        add({ category: "주도성", question: "그 일을 먼저 제안한 이유는 무엇이었고, 제안 전에 무엇을 확인했나요?",
          source: truncate(sentence, 60), prep: "문제를 인지한 계기 → 사전 확인한 근거 → 제안 방식" });
      }
    }
    if (q.type === "motivation") {
      add({ category: "지원동기", risk: "높음",
        question: "왜 다른 회사가 아니라 " + (company.name || "저희 회사") + "인가요? 경쟁사와 비교해서 말해 주세요.",
        prep: "회사 방향성 1개(출처 확인된 것) → 내 경험/가치관과 겹치는 지점 → 입사 후 하고 싶은 일 1개" });
      add({ category: "지원동기", question: (company.position || "이 직무") + "에서 입사 1년 차에 무엇을 할 수 있다고 보나요?",
        prep: "지금 할 수 있는 것(경험 기반) / 배워야 하는 것 / 그것을 배우는 방법" });
    }
    if (q.type === "strength_weakness") {
      add({ category: "약점", risk: "높음", question: "그 약점 때문에 실제로 문제가 생긴 적이 있나요? 그때 어떻게 수습했나요?",
        prep: "작은 실제 사례 → 즉시 한 조치 → 이후 바꾼 습관(지금도 하고 있는 것)" });
      add({ category: "약점", risk: "높음", question: "그 점이 이 직무 수행에 지장을 준다고 보진 않나요?",
        prep: "직무 핵심업무와 약점이 겹치지 않는 이유 + 이미 보완하고 있는 근거 경험" });
    }
  }

  const seen = new Set();
  const unique = items.filter((i) => (seen.has(i.question) ? false : (seen.add(i.question), true)));
  const order = { "높음": 0, "보통": 1, "낮음": 2 };
  unique.sort((a, b) => order[a.risk] - order[b.risk] || a.category.localeCompare(b.category));

  let targets = [...new Set(usedIds)].map((id) => (career.experiences || []).find((e) => e.id === id)).filter(Boolean);
  if (!targets.length) targets = career.experiences || [];
  const scripts = targets.map((e) => [e, scriptFor(e)]);
  const gaps = targets.filter((e) => starGaps(e).length)
    .map((e) => (e.title || e.id) + ": " + starGaps(e).join(", ") + " 미작성");
  return { items: unique, scripts, gaps };
}

function scriptFor(e) {
  const metrics = (e.metrics || []).map((m) =>
    m.before && m.after ? m.name + " " + m.before + "→" + m.after : (m.name + " " + (m.after || m.delta || "")).trim()
  ).join(" · ") || "(정량 성과 미정리)";
  return [
    "■ " + (e.title || e.id) + "  [" + (e.period || "기간 미기재") + "]",
    "",
    "· 30초 버전",
    "  " + (e.situation || "(상황 미작성)") + " 상황에서, " + (e.task || "(과제 미작성)") + " 를 맡아 " +
      (truncate(e.action, 60) || "(행동 미작성)") + " 했습니다. 그 결과 " + metrics + " 였습니다.",
    "",
    "· 60초 버전 (꼬리질문 대비)",
    "  ① 상황: " + (e.situation || "—"),
    "  ② 과제: " + (e.task || "—"),
    "  ③ 행동: " + (e.action || "—"),
    "  ④ 결과: " + (e.result || "—") + "  (" + metrics + ")",
    "  ⑤ 왜 그 방법이 가능했나: " + (e.insight || "⚠ 미작성 — 여기를 가장 많이 물어봅니다"),
    "  ⑥ 어려웠던 점: " + (e.difficulty || "—"),
    "  ⑦ 배운 점: " + (e.lesson || "—")
  ].join("\n");
}

    { id: "q4", text: "타인과 협업하여 문제를 해결한 경험을 기술해 주십시오.", type: "collaboration",
      limit: { min: null, max: 800, count_mode: "with_space" }, use: [] }
  ]
};

const EXAMPLE_DRAFT = {
  q2: { subtitle: "집계 단위를 조건 단위로 바꿔 재산출 시간을 78% 줄였습니다",
    used: ["exp-rate-agg"],
    body: "매월 요율을 재산출하는 배치가 90분 넘게 걸려, 정작 결과를 검증할 시간이 부족했습니다. 저는 산출 결과를 한 건도 바꾸지 않는다는 조건에서 소요 시간을 줄이는 일을 맡았습니다.\n\n원인을 찾기 위해 산출 로직을 계약 단위까지 따라가 보니, 담보와 지역 조건이 같은 계약은 어차피 동일한 위험률을 적용받고 있었습니다. 성능의 문제가 아니라 같은 값이 나오는 계약을 왜 따로 계산하느냐는 업무 구조의 문제였습니다. 그래서 집계 단위를 계약 단위에서 조건 단위로 재설계했습니다. 구조를 바꾸기 전에는 현업 담당자와 담보 조건의 정의를 다시 확인하고, 어떤 기준을 만족해야 같은 산출로 인정할지 먼저 합의했습니다. 다만 산출 결과가 1원이라도 달라지면 쓸 수 없는 작업이었기 때문에, 재설계 전후 결과를 전 건 대조하는 검증 쿼리를 먼저 만들고 그 위에서 구조를 바꿨습니다.\n\n그 결과 재산출 시간은 90분에서 20분으로 줄었고, 전후 결과 차이는 0건이었습니다. 줄어든 시간은 그대로 검증에 쓸 수 있었고, 매달 쫓기듯 끝내던 점검을 항목별로 나눠 볼 수 있게 되었습니다.\n\n이 경험에서 속도는 코드가 아니라 업무 정의에서 나올 때가 있다는 것을 배웠습니다. 상품업무와 언더라이팅에서도 산출 결과를 바로 고치기보다, 그 숫자가 만들어지는 구조와 조건 정의를 먼저 확인한 뒤 개선점을 찾겠습니다." }
};

/* ══════════════════════════════════════════════════════════
   8. 상태와 저장
   ══════════════════════════════════════════════════════════ */

const VIEWS = [
  ["career", "경력 노트"], ["company", "회사·문항"], ["match", "매칭"],
  ["write", "문항 작성"], ["lint", "검증"], ["interview", "면접 준비"]
];

/* 회사는 여러 개를 나란히 둔다. state.company / state.draft 는 '지금 보고 있는'
   회사를 가리키는 별칭이고, 실제 보관은 state.spaces 가 한다. 같은 객체를
   가리키므로 화면에서 고친 값은 그대로 spaces 에 남는다. */
const state = {
  career: structuredClone(EXAMPLE_CAREER),
  spaces: { s1: { name: "가나손해보험", company: structuredClone(EXAMPLE_COMPANY), draft: structuredClone(EXAMPLE_DRAFT) } },
  activeId: "s1",
  company: null,
  draft: null,
  view: "write",
  activeQ: "q2",
  isExample: true,
  generating: null
};

function activate(id) {
  const space = state.spaces[id];
  if (!space) return;
  state.activeId = id;
  state.company = space.company;
  state.draft = space.draft;
  const first = (space.company.questions || [])[0];
  if (!(space.company.questions || []).some((q) => q.id === state.activeQ)) {
    state.activeQ = first ? first.id : null;
  }
}
activate("s1");
state.activeQ = "q2";

const spaceLabel = (space) => space.company.name || space.name || "이름 없는 회사";

let db = null;
let saveTimer = null;
const LS_KEY = "jaso.workspace.v1";

function setSaveState(kind, text) {
  const dot = document.getElementById("save-dot");
  const label = document.getElementById("save-text");
  if (!dot || !label) return;
  dot.className = "dot " + kind;
  label.textContent = text;
}

async function loadWorkspace() {
  try { db = await claude.use("db"); } catch (e) { db = null; }
  let loaded = null;

  if (db) {
    try {
      const [career, meta, spaces, oldCo, oldDraft] = await Promise.all([
        db.doc("workspace/career").get(),
        db.doc("workspace/meta").get(),
        db.collection("spaces").get(),
        db.doc("workspace/company").get(),
        db.doc("workspace/draft").get()
      ]);
      const fromSpaces = {};
      spaces.docs.forEach((doc) => { fromSpaces[doc.id] = doc.data(); });

      if (!Object.keys(fromSpaces).length && oldCo.exists) {
        /* 예전 단일 회사 저장본을 회사 하나로 옮긴다 */
        fromSpaces.s1 = { name: (oldCo.data() || {}).name || "회사",
                          company: oldCo.data(), draft: oldDraft.exists ? oldDraft.data() : {} };
      }
      if (career.exists || Object.keys(fromSpaces).length) {
        loaded = { career: career.exists ? career.data() : null, spaces: fromSpaces,
                   activeId: (meta.exists ? meta.data() : {}).activeId };
      }
    } catch (e) { /* 저장소를 못 읽으면 로컬로 내려간다 */ }
  }
  if (!loaded) {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) loaded = JSON.parse(raw);
    } catch (e) { /* 무시 */ }
  }

  if (loaded && (loaded.career || Object.keys(loaded.spaces || {}).length)) {
    if (loaded.career) state.career = loaded.career;
    if (Object.keys(loaded.spaces || {}).length) {
      state.spaces = loaded.spaces;
      Object.values(state.spaces).forEach((sp) => { sp.company = sp.company || {}; sp.draft = sp.draft || {}; });
    }
    state.isExample = false;
    activate(loaded.activeId && state.spaces[loaded.activeId] ? loaded.activeId : Object.keys(state.spaces)[0]);
  }
  setSaveState(db ? "saved" : "local", db ? "저장됨" : "이 브라우저에만 저장");
}

function markDirty() {
  state.isExample = false;
  setSaveState("dirty", "저장 중…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 700);
}

async function save() {
  const payload = { career: state.career, spaces: state.spaces, activeId: state.activeId };
  try { localStorage.setItem(LS_KEY, JSON.stringify(payload)); } catch (e) { /* 용량 초과 등 */ }
  if (!db) { setSaveState("local", "이 브라우저에만 저장"); return; }
  const space = state.spaces[state.activeId];
  try {
    await Promise.all([
      db.doc("workspace/career").set(state.career),
      db.doc("spaces/" + state.activeId).set({ name: spaceLabel(space), company: space.company, draft: space.draft }),
      db.doc("workspace/meta").set({ activeId: state.activeId, order: Object.keys(state.spaces) })
    ]);
    setSaveState("saved", "저장됨 " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }));
  } catch (err) {
    setSaveState("local", err && err.code === "quota_exceeded" ? "저장 공간 초과" : "이 브라우저에만 저장");
  }
}

/* 경로 기반 바인딩 — career.experiences.0.title 같은 경로로 값을 읽고 쓴다 */
function getPath(path) {
  return path.split(".").reduce((obj, key) => (obj == null ? obj : obj[key]), state);
}
function setPath(path, value) {
  const keys = path.split(".");
  const last = keys.pop();
  const target = keys.reduce((obj, key) => obj[key], state);
  target[last] = value;
}

/* ══════════════════════════════════════════════════════════
   9. 프롬프트
   ══════════════════════════════════════════════════════════ */

function expBlock(e) {
  const lines = ["### 경험 [" + e.id + "] " + (e.title || "")];
  const pairs = [["기간", e.period], ["소속", e.org], ["역할", e.role], ["분야", (e.domain || []).join(", ")],
    ["상황", e.situation], ["과제", e.task], ["행동", e.action], ["결과", e.result],
    ["도메인 통찰", e.insight], ["어려웠던 점", e.difficulty], ["협업", e.collaboration], ["배운 점", e.lesson]];
  for (const [k, v] of pairs) if (v) lines.push("- " + k + ": " + v);
  for (const m of e.metrics || []) {
    const text = [m.name, m.before, m.after, m.delta].filter(Boolean).join(" ");
    if (text) lines.push("- 수치: " + text);
  }
  if (e.confidential) lines.push("- ⚠ 대외비: 고객사명 등은 일반화해서 표현할 것");
  return lines.join("\n");
}

function systemPrompt() {
  return "당신은 한국 대기업/금융권 자기소개서를 다뤄온 채용 컨설턴트입니다.\n" +
    "지원자가 제공한 '경력 노트'에 적힌 사실만으로 자소서를 씁니다.\n\n[절대 규칙]\n" +
    WRITING_RULES.map((r, i) => (i + 1) + ". " + r).join("\n") +
    "\n\n재료가 부족해 문단을 채울 수 없으면, 문장을 지어내지 말고 그 자리에 '⚠ 확인 필요: (무엇을 물어봐야 하는지)' 를 남기세요.";
}

function questionPrompt(plan) {
  const { career, company } = state;
  const q = plan.question;
  const limit = q.limit || {};
  const modeLabel = limit.count_mode === "without_space" ? "공백제외" : "공백포함";
  const limitText = limit.min && limit.max ? limit.min + "~" + limit.max + "자(" + modeLabel + ")"
    : limit.max ? "최대 " + limit.max + "자(" + modeLabel + ")"
    : limit.min ? "최소 " + limit.min + "자(" + modeLabel + ")" : "제한 없음";
  const out = ["## 지원 정보", "- 회사: " + company.name, "- 직무: " + company.position + (company.team ? " (" + company.team + ")" : "")];
  if ((company.coreCompetencies || []).length) out.push("- 직무 핵심역량: " + company.coreCompetencies.join(", "));
  const axes = resolveAxes(company);
  if (axes.length) out.push("- 인재상: " + axes.map((a) => a.source + " → " + a.axis).join(", "));
  const usable = usableResearch(company);
  if (usable.length) {
    out.push("- 인용 가능한 회사 사실(확인 완료):");
    usable.forEach((r) => out.push("  · " + r.claim + " (출처: " + r.source + (r.date ? ", " + r.date : "") + ")"));
  } else {
    out.push("- 인용 가능한 회사 사실: 없음 → 회사 관련 사실 주장을 쓰지 말 것");
  }
  out.push("", "## 문항", q.text, "- 글자수: " + limitText + " (목표 " + plan.target + "자 내외)");
  out.push("", "## 문단 구성 (이 배분을 지킬 것)");
  plan.paragraphs.forEach((p) => out.push("- " + p.name + ": 약 " + p.chars + "자(" + p.share + "%)" + (p.guide ? " — " + p.guide : "")));
  out.push("", "## 쓸 수 있는 재료 (여기 없는 내용은 쓰지 말 것)");
  plan.picks.forEach((p) => { out.push(expBlock(p.m.exp)); out.push("  (추천 점수 " + p.score + " — " + p.why.slice(0, 3).join("; ") + ")"); });

  if (q.type === "strength_weakness") {
    if ((career.strengths || []).length) {
      out.push("", "### 강점(지원자가 실제로 말한 것)");
      career.strengths.forEach((t) => out.push("- " + t.label + ": " + (t.detail || "")));
    }
    if ((career.weaknesses || []).length) {
      out.push("", "### 약점(지원자가 실제로 말한 것 — 여기 없는 약점 금지)");
      career.weaknesses.forEach((t) => out.push("- " + t.label + ": " + (t.detail || "") +
        " / 개선: " + (t.improving || "—") + " / 보완 강점: " + (t.offset_by || "—")));
    }
  }
  if (q.type === "motivation" && (career.values || []).length) {
    out.push("", "### 지원자의 가치관");
    career.values.forEach((v) => out.push("- " + v));
  }
  if (plan.subtitles.length) {
    out.push("", "## 소제목 후보 (그대로 쓰지 말고 다듬을 것)");
    plan.subtitles.forEach((s) => out.push("- " + s));
  }
  out.push("", "## 출력 형식", "소제목: [방법 + 결과 형태의 한 줄]",
    "본문: (문단 구성에 맞춰 작성, 줄바꿈으로 문단 구분)",
    "확인필요: (지어내지 않고 비워둔 부분이 있으면 목록으로, 없으면 '없음')",
    "", "작성 후 글자수를 세어 " + limitText + " 범위인지 직접 확인하세요.");
  return out.join("\n");
}

function parseDraft(text) {
  let subtitle = "";
  const bodyLines = [], todoLines = [];
  let section = null;
  for (const line of (text || "").split("\n")) {
    const t = line.trim();
    if (/^소제목\s*[:：]/.test(t)) { subtitle = t.replace(/^소제목\s*[:：]\s*/, "").replace(/^\[|\]$/g, "").trim(); section = null; continue; }
    if (/^본문\s*[:：]/.test(t)) { section = "body"; const rest = t.replace(/^본문\s*[:：]\s*/, ""); if (rest) bodyLines.push(rest); continue; }
    if (/^확인\s*필요\s*[:：]/.test(t)) { section = "todo"; const rest = t.replace(/^확인\s*필요\s*[:：]\s*/, ""); if (rest) todoLines.push(rest); continue; }
    if (section === "body") bodyLines.push(line.replace(/\s+$/, ""));
    else if (section === "todo" && t) todoLines.push(t);
  }
  const body = bodyLines.join("\n").trim();
  const todo = todoLines.filter((t) => t && t !== "없음").join("\n").trim();
  return { subtitle, body: body || (subtitle ? "" : (text || "").trim()), todo };
}

<script>

const $ = (sel) => document.querySelector(sel);
const lines = (arr) => (arr || []).join("\n");
const csv = (arr) => (arr || []).join(", ");

function field(label, path, opts = {}) {
  const value = getPath(path);
  const type = opts.type || "text";
  const attrs = 'data-bind="' + path + '" data-type="' + type + '" id="f-' + path.replace(/\./g, "-") + '"';
  let control;
  if (opts.rows) {
    const shown = type === "lines" ? lines(value) : (value == null ? "" : value);
    control = "<textarea rows=\"" + opts.rows + "\" " + attrs + " placeholder=\"" + esc(opts.ph || "") + "\">" + esc(shown) + "</textarea>";
  } else if (opts.options) {
    control = "<select " + attrs + ">" + opts.options.map(([v, l]) =>
      '<option value="' + esc(v) + '"' + (String(value) === String(v) ? " selected" : "") + ">" + esc(l) + "</option>").join("") + "</select>";
  } else if (type === "bool") {
    return '<label class="row" style="gap:7px;font-size:13px"><input type="checkbox" ' + attrs +
      (value ? " checked" : "") + ' style="width:auto">' + esc(label) + "</label>";
  } else {
    const shown = type === "csv" ? csv(value) : (value == null ? "" : value);
    control = '<input type="' + (type === "number" ? "number" : "text") + '" ' + attrs +
      ' value="' + esc(shown) + '" placeholder="' + esc(opts.ph || "") + '">';
  }
  return '<label class="field"><span>' + esc(label) + (opts.hint ? " <em>" + esc(opts.hint) + "</em>" : "") + "</span>" + control + "</label>";
}

function renderNav() {

    (id === "lint" && errors ? '<span class="badge">' + errors + "</span>" : "") + "</button>").join("");
}

/* ── 경력 노트 ── */
function renderCareer() {

    const list = c[kind] || [];

  const expRows = (c.experiences || []).map((e, i) => {
    const gaps = starGaps(e);
    const metrics = (e.metrics || []).map((m, j) => '<div class="metric-row">' +
      '<input type="text" data-bind="career.experiences.' + i + '.metrics.' + j + '.name" data-type="text" value="' + esc(m.name) + '" placeholder="지표">' +
      '<input type="text" data-bind="career.experiences.' + i + '.metrics.' + j + '.before" data-type="text" value="' + esc(m.before) + '" placeholder="이전">' +
      '<input type="text" data-bind="career.experiences.' + i + '.metrics.' + j + '.after" data-type="text" value="' + esc(m.after) + '" placeholder="이후">' +
      '<input type="text" data-bind="career.experiences.' + i + '.metrics.' + j + '.delta" data-type="text" value="' + esc(m.delta) + '" placeholder="변화폭">' +
      '<button class="btn quiet" data-act="del-metric" data-i="' + i + '" data-j="' + j + '">✕</button></div>').join("");

    return '<details class="exp"' + (state.openExp === e.id ? " open" : "") + ' data-exp="' + esc(e.id) + '">' +

      '<span class="flags">' + (e.confidential ? '<span class="flag conf">대외비</span>' : "") +

<script>
/* ── 문항 작성 ── */
function limitLabel(q) {
  const l = q.limit || {};
  const mode = l.count_mode === "without_space" ? "공백제외" : "공백포함";
  if (l.min && l.max) return l.min + "~" + l.max + "자(" + mode + ")";
  if (l.max) return "최대 " + l.max + "자(" + mode + ")";
  if (l.min) return "최소 " + l.min + "자(" + mode + ")";
  return "제한 없음";
}

function counterHTML(q, answer) {
  const full = (answer.subtitle ? "[" + answer.subtitle + "]\n" : "") + (answer.body || "");
  const c = countChars(full);
  const l = q.limit || {};
  const mode = l.count_mode === "without_space" ? "without_space" : "with_space";
  const actual = mode === "with_space" ? c.withSpace : c.withoutSpace;
  let cls = "fit";
  if (l.max && actual > l.max) cls = "over";
  else if (l.min && actual < l.min) cls = "under";
  else if (l.max && actual < l.max * 0.8) cls = "under";
  const ceiling = l.max || Math.max(actual, l.min || 1000);
  const pct = Math.min(100, Math.round(actual / ceiling * 100));
  const minMark = l.min && l.max ? Math.round(l.min / l.max * 100) : null;
  return '<div class="counter"><span class="big ' + cls + '">' + actual + "</span>" +
    "<span>/ " + limitLabel(q) + "</span>" +
    '<span style="margin-left:auto;color:var(--muted)">공백포함 ' + c.withSpace + " · 공백제외 " + c.withoutSpace + "</span></div>" +
    '<div class="gauge"><i class="' + (cls === "over" ? "over" : "") + '" style="width:' + pct + '%"></i>' +
    (minMark !== null ? '<b style="left:' + minMark + '%"></b>' : "") + "</div>";
}

function renderWrite() {
  const { career, company, draft } = state;
  const questions = company.questions || [];
  if (!questions.length) {
    $("#panel-write").innerHTML = '<div class="panel-head"><h2 id="h-write">문항 작성</h2></div>' +
      '<p class="empty">회사·문항 탭에서 문항을 먼저 입력하세요.</p>';
    return;
  }
  if (!questions.some((q) => q.id === state.activeQ)) state.activeQ = questions[0].id;
  const q = questions.find((x) => x.id === state.activeQ);
  const answer = draft[q.id] || (draft[q.id] = { subtitle: "", body: "", used: [], note: "" });
  const plan = planAll(career, company).find((x) => x.question.id === q.id) || planQuestion(q, career, company);
  const findings = lintAnswer(q, answer, career, company).filter((f) => f.level !== "INFO");

  const tabs = questions.map((x) => {
    const a = draft[x.id] || {};
    const done = (a.body || "").trim().length > 0;
    return '<button class="btn' + (x.id === q.id ? " primary" : "") + '" data-act="pick-q" data-q="' + esc(x.id) + '">' +
      esc(x.id) + " · " + esc(QUESTION_TYPES[x.type] ? QUESTION_TYPES[x.type].label : x.type) + (done ? " ✓" : "") + "</button>";
  }).join("");

  const picks = plan.picks.map((p, i) => '<div class="pick"><span class="rank">' + (i + 1) + "</span><div><b>" +
    esc(p.m.exp.title || p.m.exp.id) + '</b> <span class="note">' + p.score + '점</span><div class="why">' +
    esc(p.why.slice(0, 3).join(" · ")) + "</div>" +
    (starGaps(p.m.exp).length ? '<div class="why" style="color:var(--warn)">보강 필요: ' +
      esc(starGaps(p.m.exp).join(", ")) + "</div>" : "") + "</div></div>").join("");

  const paras = plan.paragraphs.map((p) => '<span>' + esc(p.name) + '</span><span class="share">' +
    p.share + "% · " + p.chars + "자</span><span></span>" +
    (p.guide ? '<span class="guide">' + esc(p.guide) + "</span>" : "")).join("");

  const subs = plan.subtitles.map((s) =>
    '<button class="sub-cand" data-act="use-subtitle" data-value="' + esc(s) + '">' + esc(s) + "</button>").join("");

  const useBoxes = (career.experiences || []).map((e) =>
    '<label class="chip"><input type="checkbox" data-act="toggle-answer-use" data-exp="' + esc(e.id) + '"' +
    ((answer.used || []).includes(e.id) ? " checked" : "") + "> " + esc(e.title || e.id) + "</label>").join("");

  $("#panel-write").innerHTML =
    '<div class="panel-head"><h2 id="h-write">문항 작성</h2>' +
    "<p>왼쪽에 쓰고, 오른쪽 재료만 사용합니다. 오른쪽에 없는 내용을 쓰면 검증에서 걸립니다.</p></div>" +
    '<div class="row" style="margin-bottom:16px">' + tabs + "</div>" +
    '<div class="writer">' +
      '<div class="stack">' +
        '<div class="card stack">' +
          '<p class="qtext">' + esc(q.text) + "</p>" +
          '<label class="field"><span>소제목 <em>[방법] + [결과]</em></span>' +
          '<input type="text" id="subtitle-input" data-answer="subtitle" value="' + esc(answer.subtitle || "") +
          '" placeholder="예: 집계 단위를 바꿔 산출 시간을 78% 줄였습니다"></label>' +
          '<div id="counter-slot">' + counterHTML(q, answer) + "</div>" +
          '<textarea id="body-input" data-answer="body" rows="18" placeholder="본문을 입력하거나, 아래 버튼으로 초안을 받아 고쳐 쓰세요">' +
          esc(answer.body || "") + "</textarea>" +
          (answer.note ? '<p class="note" style="color:var(--warn)">확인 필요: ' + esc(answer.note) + "</p>" : "") +
          '<div class="row"><button class="btn primary" data-act="generate" id="gen-btn">Claude로 초안 만들기</button>' +
          '<button class="btn" data-act="copy-prompt">프롬프트 복사</button>' +
          '<button class="btn quiet" data-act="clear-answer">본문 비우기</button></div>' +
          '<div id="gen-slot"></div>' +
        "</div>" +
        '<div class="card"><h4 style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px">근거 경험</h4>' +
        '<div class="tag-input">' + (useBoxes || '<span class="note">경험이 없습니다</span>') + "</div></div>" +
        (findings.length ? '<div class="card"><h4 style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px">이 문항의 지적 ' +
          findings.length + "건</h4>" + findings.map(findingHTML).join("") + "</div>" : "") +
      "</div>" +
      '<div class="stack material">' +
        '<div class="card"><h4>문단 구성 · 목표 ' + plan.target + '자</h4><div class="para">' + paras + "</div></div>" +
        '<div class="card"><h4>쓸 경험 (추천순)</h4>' + (picks || '<span class="note">추천할 경험이 없습니다</span>') + "</div>" +
        (subs ? '<div class="card"><h4>소제목 후보 — 눌러서 넣고 다듬으세요</h4>' + subs + "</div>" : "") +
        (plan.warnings.length ? '<div class="card"><h4>확인 필요</h4>' +
          plan.warnings.map((w) => '<p class="note" style="color:var(--warn)">· ' + esc(w) + "</p>").join("") + "</div>" : "") +
      "</div></div>";
